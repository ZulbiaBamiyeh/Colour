<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonk Blob</title>
<meta name="description" content="Bat a squishy blob as far as you can. Draft field cards, discover combos, buy upgrades and bonk further every run.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a full-bleed 3D ballfield; chunky sticker-like UI floats over it with 16px gutters. */
:root{
  --ink:#3a2748;
  --ink-soft:#6b5a7a;
  --cream:#fff8ec;
  --paper:#fffdf7;
  --sun:#ffcf3f;
  --sun-deep:#f0a81c;
  --coral:#ff6b6b;
  --mint:#6fe0b0;
  --sky:#8fd6ff;
  --lilac:#b79cff;
  --gold:#ffd23f;
  --display:'Bagel Fat One','Fredoka',ui-rounded,system-ui,sans-serif;
  --ui:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd6ff;}
body{font-family:var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#game{position:fixed;inset:0;overflow:hidden;background:#8fd6ff}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;left:0;top:0;font-family:var(--display);font-size:22px;color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;will-change:transform,opacity;letter-spacing:.02em}
.floater.big{font-size:30px}
.floater.coin{color:var(--gold);font-size:18px}
.floater.bad{color:#c9b8d6}

button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn{font-family:var(--display);font-size:22px;letter-spacing:.02em;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:12px 26px 14px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,filter .15s;line-height:1}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.small{font-size:16px;padding:9px 16px 10px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)}
.btn.sky{background:var(--sky)}
.btn.coral{background:var(--coral);color:var(--paper)}
.btn.ghost{background:var(--paper)}
.btn[disabled]{filter:grayscale(.7) opacity(.6);cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{background:var(--sun)}

.coin-ico{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8 0 18%,var(--gold) 20% 62%,var(--sun-deep) 64%);border:2.5px solid var(--ink);vertical-align:-4px;flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 14px 5px 8px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#hud .top > *{pointer-events:auto}
.dist{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;pointer-events:none}
#hudDist{font-family:var(--display);font-size:clamp(40px,10vw,64px);line-height:1;color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#hudDist small{font-size:.5em;margin-left:2px}
#hudBest{margin-top:4px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(255,253,247,.85);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;display:inline-block}
#swingPips{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;gap:6px}
.pip{width:16px;height:16px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);position:relative}
.pip::after{content:'';position:absolute;inset:2px 4px;border-left:1.5px solid var(--coral);border-right:1.5px solid var(--coral);border-radius:50%}
.pip.used{background:#cdbfd9;opacity:.6}
.pip.now{background:var(--sun);transform:scale(1.2)}
#strikes{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;gap:5px;font-family:var(--display);font-size:15px}
.strike{width:22px;height:22px;border-radius:7px;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;color:var(--paper)}
.strike.on{background:var(--coral)}
#chain{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 76px);font-family:var(--display);font-size:24px;color:var(--sun);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;transform-origin:right center}
#btnFast{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:auto;width:auto;padding:0 14px;gap:6px;display:flex;font-weight:700;font-size:15px}
#tapHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22%);transform:translateX(-50%);font-family:var(--display);font-size:22px;color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:bob 1s ease-in-out infinite}
#judge{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(48px,14vw,96px);color:var(--sun);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;white-space:nowrap;opacity:0;pointer-events:none;letter-spacing:.01em}
#biomeToast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);font-family:var(--display);font-size:22px;color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;white-space:nowrap;opacity:0}
#deckStrip{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;max-width:min(72%,420px)}
#deckStrip .mini{width:26px;height:26px;border-radius:8px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.mini{width:34px;height:34px;flex:none;border-radius:10px;border:2.5px solid var(--ink);background:var(--paper) center/cover no-repeat;box-shadow:0 3px 0 var(--ink)}
.mini.combo{background-color:var(--sun);box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--sun) inset}

@keyframes bob{50%{transform:translate(-50%,-6px)}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-sizing:border-box;pointer-events:none}
.screen > *{pointer-events:auto}
.logo{font-family:var(--display);line-height:.85;text-align:center;color:var(--sun);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;margin:0;font-weight:400}
.logo span{display:inline-block;animation:logoBob 1.6s ease-in-out infinite}
.logo .l2{color:var(--coral)}
@keyframes logoBob{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-8px) scale(.94,1.06)}60%{transform:translateY(2px) scale(1.06,.94)}}

#scrTitle{justify-content:space-between;cursor:pointer}
#scrTitle .logo{font-size:clamp(64px,19vw,140px);margin-top:6vh}
#scrTitle .tap{font-family:var(--display);font-size:24px;color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:pulse 1.2s ease-in-out infinite;margin-bottom:6vh}
@keyframes pulse{50%{transform:scale(1.08)}}

#scrHub{justify-content:space-between}
.hub-top{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hub-top .stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.best-chip{font-size:15px}
.best-chip b{font-family:var(--display);font-weight:400;font-size:17px}
.hub-logo{font-size:clamp(40px,11vw,64px);margin-top:4px}
.hub-mid{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:440px}
.charsel{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.charsel .info{text-align:center;flex:1;min-width:0;background:rgba(255,253,247,.92);border:3px solid var(--ink);border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 var(--ink)}
.charsel .name{font-family:var(--display);font-size:28px;line-height:1}
.charsel .blurb{font-size:14px;color:var(--ink-soft);margin-top:4px;text-wrap:balance}
.charsel .lock{margin-top:8px}
.charsel .lock:empty{display:none}
.hub-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;align-items:stretch}
.hub-actions .row{display:flex;gap:10px}
.hub-actions .row .btn{flex:1}
.play{font-size:30px;padding:16px 20px 18px;background:var(--coral);color:var(--paper);-webkit-text-stroke:0}
.milestone{font-size:13px;font-weight:600;color:var(--ink);background:rgba(255,253,247,.85);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;text-align:center}

/* Draft */
#scrDraft{justify-content:center;gap:14px;background:linear-gradient(rgba(58,39,72,.0),rgba(58,39,72,.45) 70%)}
.draft-title{font-family:var(--display);font-size:clamp(30px,8vw,44px);color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-align:center;line-height:1}
.draft-sub{font-weight:600;color:var(--paper);text-shadow:0 2px 0 var(--ink);text-align:center;font-size:15px;margin-top:-6px}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:720px}
.card{width:clamp(100px,28vw,160px);background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 var(--ink);padding:0 0 12px;display:flex;flex-direction:column;align-items:stretch;text-align:center;position:relative;transition:transform .15s;animation:dealIn .5s cubic-bezier(.2,1.4,.4,1) both}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
.card:active{transform:translateY(2px)}
.card .art{aspect-ratio:1;border-radius:15px 15px 0 0;border-bottom:3px solid var(--ink);background:var(--mint) center/88% no-repeat}
.card.r1 .art{background-color:var(--sky)}
.card.r2 .art{background-color:var(--lilac)}
.card.cmb .art{background-color:var(--sun)}
.card .cname{font-family:var(--display);font-size:clamp(14px,3.6vw,18px);line-height:1.05;margin:10px 8px 4px;text-wrap:balance}
.card .cdesc{font-size:clamp(11px,2.8vw,13px);line-height:1.25;color:var(--ink-soft);margin:0 8px;text-wrap:balance}
.card .rar{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:1px 7px}
.card .count{position:absolute;top:8px;right:8px;font-family:var(--display);font-size:13px;background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 8px}
.card .badge{position:absolute;left:50%;top:calc(100% - 4px);transform:translate(-50%,0) rotate(-3deg);font-family:var(--display);font-size:13px;white-space:nowrap;background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;box-shadow:0 3px 0 var(--ink);animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{50%{transform:translate(-50%,0) rotate(3deg) scale(1.06)}}
@keyframes dealIn{from{transform:translateY(80px) rotate(8deg) scale(.6);opacity:0}}
.card.picked{animation:pickOut .45s ease-in forwards}
.card.gone{animation:dropOut .3s ease-in forwards}
@keyframes pickOut{40%{transform:translateY(-20px) scale(1.12)}to{transform:translateY(-60vh) scale(.3) rotate(-20deg);opacity:0}}
@keyframes dropOut{to{transform:translateY(60px) scale(.8);opacity:0}}
.deck-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:520px;min-height:34px}

/* Combo reveal */
#comboReveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle,rgba(255,207,63,.55),rgba(58,39,72,.6) 70%);pointer-events:auto}
#comboReveal .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,253,247,.22) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#comboReveal .head{font-family:var(--display);font-size:clamp(28px,8vw,48px);color:var(--sun);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-align:center;line-height:1;position:relative}
#comboReveal .recipe{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:28px;color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;position:relative}
#comboReveal .recipe .mini{width:56px;height:56px;border-radius:14px}
#comboReveal .card{animation:comboIn .7s cubic-bezier(.2,1.6,.4,1) both;width:clamp(150px,40vw,190px)}
@keyframes comboIn{from{transform:scale(.2) rotate(-30deg);opacity:0}}

/* Result */
#scrResult,#scrSummary{justify-content:center}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:18px 20px 20px;width:100%;max-width:400px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:panelIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes panelIn{from{transform:translateY(40px) scale(.9);opacity:0}}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-align:center;letter-spacing:.02em}
.bigdist{font-family:var(--display);font-size:clamp(54px,16vw,80px);line-height:1;text-align:center;color:var(--sun);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums}
.bigdist small{font-size:.45em}
.newbest{align-self:center;font-family:var(--display);background:var(--coral);color:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;transform:rotate(-3deg);animation:wiggle2 .8s ease-in-out infinite}
@keyframes wiggle2{50%{transform:rotate(3deg) scale(1.08)}}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;border-bottom:2px dashed #e6dbe9;padding-bottom:6px;font-variant-numeric:tabular-nums}
.line:last-child{border-bottom:0}
.line.total{font-family:var(--display);font-weight:400;font-size:22px}
.line span:last-child{display:inline-flex;align-items:center;gap:6px}
.panel .btn{align-self:stretch}

/* Sheets */
.sheet{position:absolute;inset:0;background:rgba(58,39,72,.5);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.sheet .inner{background:var(--cream);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:84%;display:flex;flex-direction:column;animation:sheetUp .35s cubic-bezier(.2,1.2,.4,1) both;box-sizing:border-box}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;gap:10px}
.sheet header h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.sheet .body{overflow:auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.up{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.up .t{font-family:var(--display);font-size:18px;line-height:1}
.up .d{font-size:13px;color:var(--ink-soft);grid-column:1}
.up .pips{display:flex;gap:3px;flex-wrap:wrap;grid-column:1}
.up .pips i{width:10px;height:10px;border-radius:3px;border:2px solid var(--ink);background:var(--paper)}
.up .pips i.on{background:var(--mint)}
.up .btn{grid-column:2;grid-row:1 / span 3;display:flex;align-items:center;gap:6px;min-width:96px;justify-content:center}
.up .btn .coin-ico{width:16px;height:16px;border-width:2px}
.up.flash{animation:upFlash .5s}
@keyframes upFlash{30%{transform:scale(1.03);background:#fff1b8}}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.entry{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.entry .art{width:72px;height:72px;border-radius:14px;border:2.5px solid var(--ink);background:var(--sun) center/88% no-repeat}
.entry.locked .art{background:#e7dcea;display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#bba9c6}
.entry .n{font-family:var(--display);font-size:15px;line-height:1.05}
.entry .r{font-size:12px;color:var(--ink-soft);font-weight:600}
.entry .dsc{font-size:12px;color:var(--ink-soft)}
.book-note{font-size:14px;color:var(--ink-soft);margin:0}

@media (prefers-reduced-motion: reduce){
  .logo span,#tapHint,.card .badge,.newbest,#scrTitle .tap,#comboReveal .rays{animation:none}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="floaters"></div>

  <div id="hud" hidden>
    <div class="top">
      <div class="chip"><i class="coin-ico"></i><span id="hudCoins">0</span></div>
      <button id="btnMute" class="icon-btn" aria-label="Sound on or off"></button>
    </div>
    <div class="dist"><div id="hudDist">0<small>m</small></div><div id="hudBest">Best 0 m</div></div>
    <div id="swingPips"></div>
    <div id="strikes"></div>
    <div id="chain" hidden></div>
    <div id="deckStrip"></div>
    <button id="btnFast" class="icon-btn" hidden aria-label="Fast forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z"/></svg><span>2×</span></button>
    <div id="tapHint" hidden>Tap when the rings meet!</div>
    <div id="biomeToast"></div>
    <div id="judge"></div>
  </div>

  <section id="scrTitle" class="screen">
    <h1 class="logo"><span>BONK</span><br><span class="l2" style="animation-delay:.2s">BLOB</span></h1>
    <div class="tap">Tap to play</div>
  </section>

  <section id="scrHub" class="screen" hidden>
    <div class="hub-top">
      <div class="stack">
        <div class="chip"><i class="coin-ico"></i><span id="hubCoins">0</span></div>
        <div class="chip best-chip">Best&nbsp;<b id="hubBest">0 m</b></div>
      </div>
      <h1 class="logo hub-logo"><span>BONK</span><br><span class="l2" style="animation-delay:.2s">BLOB</span></h1>
      <button id="btnMute2" class="icon-btn" aria-label="Sound on or off"></button>
    </div>
    <div class="hub-actions">
      <div class="charsel">
        <button class="icon-btn" id="charPrev" aria-label="Previous character"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="info">
          <div class="name" id="charName">Pom</div>
          <div class="blurb" id="charBlurb"></div>
          <div class="lock" id="charLock"></div>
        </div>
        <button class="icon-btn" id="charNext" aria-label="Next character"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="milestone" id="milestone"></div>
      <button class="btn play" id="btnPlay">Play ball!</button>
      <div class="row">
        <button class="btn mint" id="btnShop">Upgrades</button>
        <button class="btn sky" id="btnBook">Combos</button>
      </div>
    </div>
  </section>

  <section id="scrDraft" class="screen" hidden>
    <div class="draft-title" id="draftTitle">Pick a field card</div>
    <div class="draft-sub" id="draftSub">It changes what grows in the field</div>
    <div class="cards" id="draftCards"></div>
    <div class="deck-row" id="draftDeck"></div>
  </section>

const PAL_KEYS = ['skyTop', 'skyBot', 'fog', 'gA', 'gB', 'side', 'hillFar', 'hillNear', 'leaf', 'trunk', 'sun'];

function applyBiome(x) {
  for (const k of PAL_KEYS) pal[k].copy(BIOME_C[0][k]);
  let stars = BIOMES[0].stars;
  for (let i = 1; i < BIOMES.length; i++) {
    const t = smooth(BIOMES[i].at - 160, BIOMES[i].at + 160, x);
    if (t <= 0) break;
    for (const k of PAL_KEYS) pal[k].lerp(BIOME_C[i][k], t);

  skyU.uTop.value.copy(pal.skyTop); skyU.uBot.value.copy(pal.skyBot); skyU.uSun.value.copy(pal.sun); skyU.uStars.value = stars;
  scene.fog.color.copy(pal.fog);

  hillFarM.color.copy(pal.hillFar); hillNearM.color.copy(pal.hillNear);
  leafM.color.copy(pal.leaf); trunkM.color.copy(pal.trunk);

/* =====================================================================

function newRun() {

function rollCards(n) {
  const ids = Object.keys(CARDS), out = [];
  const owned = new Set(G.run ? G.run.deck : []);
  while (out.length < n && out.length < ids.length) {
    const w = {};
    for (const id of ids) {
      if (out.includes(id)) continue;
      let wt = [60, 30, 13][CARDS[id].r];
      if (COMBOS.some(c => !has(c.id) && ((c.a === id && owned.has(c.b)) || (c.b === id && owned.has(c.a))))) wt *= 1.7;
      w[id] = wt;

    out.push(weighted(w));
  }
  return out;
}
function comboFor(id) {
  const deck = new Set(G.run.deck);

/* =====================================================================
   PITCH — the blob hops in; tap when the rings meet
   ===================================================================== */
const HOP = 0.42, PITCH_G = 16;
function startPitch() {
  G.mode = 'pitch';
  const P = G.P;
  const tC = clamp(0.92 - G.run.swing * 0.02, 0.76, 0.92) + rand(-0.05, 0.05);
  const x0 = 5.4;
  const p = G.pitch = { t: -0.35, tC, x0, vx: (CONTACT.x - x0) / tC, vy0: 0, swung: false, missT: -1, res: null };
  p.vy0 = (CONTACT.y - P.R + 0.5 * PITCH_G * tC * tC) / tC;
  G.b = newBlobState(); G.b.x = 9.6; G.b.y = P.R;
  blob.setFace('idle');
  $('tapHint').hidden = save.tut;
  const tw = windows().gr * 2.4 / tC;
  target.geometry.dispose(); target.geometry = new THREE.RingGeometry(1 - tw, 1 + tw, 64);
  renderStrikes();
}
function windows() {
  const sw = 1 + 0.13 * lvl('sweet') + G.F.sweet;
  return { p: 0.033 * sw, gr: 0.078 * sw, go: 0.135 * sw };
}
function updatePitch(dt) {
  const p = G.pitch, b = G.b, P = G.P;
  p.t += dt;
  const t = p.t;
  if (t < 0) { b.x = 9.6; b.y = P.R; }
  else if (t < HOP * 2) {
    const k = t < HOP ? 0 : 1, u = (t - k * HOP) / HOP;
    const xs = [9.6, 7.5, 5.4];
    b.x = lerp(xs[k], xs[k + 1], u); b.y = P.R + Math.sin(Math.PI * u) * 1.1;
    if (u < 0.08 && !p['h' + k]) { p['h' + k] = true; b.sqv -= 5; Sound.squish(); }
    b.vx = -5;
  } else if (!p.res || p.res === 'miss') {
    const tt = t - HOP * 2;
    b.x = p.x0 + p.vx * tt;
    b.y = P.R + p.vy0 * tt - 0.5 * PITCH_G * tt * tt;
    b.vx = p.vx; b.vy = p.vy0 - PITCH_G * tt;
    if (b.y < P.R) { b.y = P.R; b.x = p.x0 + p.vx * tt; }
    if (!p.landedPast && b.y <= P.R && tt > p.tC) { p.landedPast = true; b.sqv -= 6; Sound.squish(); }
    // rings
    const W = windows(), K = 2.4 / p.tC;
    const show = !p.swung;
    ring.visible = target.visible = targetCore.visible = show;
    if (show) {
      const R0 = P.R * 1.15;
      target.scale.setScalar(R0); targetCore.scale.setScalar(R0);
      const s = Math.max(0.05, R0 * (1 + K * (p.tC - tt)));
      ring.scale.setScalar(s);
      const d = Math.abs(tt - p.tC);
      ringMat.color.set(d <= W.p ? '#ffcf3f' : d <= W.gr ? '#fff1a8' : '#ffffff');
      ringMat.opacity = clamp(1 - (tt - p.tC - W.go) * 8, 0, 1);
      const face = camera.position;
      for (const m of [ring, target, targetCore]) m.lookAt(face.x, face.y, face.z);
    }
    if (!p.swung && tt > p.tC + W.go + 0.04) { p.swung = true; p.res = 'miss'; p.missT = 0.55; blob.setFace('look'); }
    if (p.missT > 0) { p.missT -= dt; if (p.missT <= 0) strike(); }
  }
}
function tryHit() {
  const p = G.pitch;
  if (!p || p.swung) return;
  const tt = p.t - HOP * 2;
  if (tt < -0.15) return; // still hopping in
  const W = windows();
  const dt = tt - p.tC, a = Math.abs(dt);
  p.swung = true;
  swingBat();
  if (a > W.go) {
    p.res = 'miss'; p.missT = 0.6;
    Sound.whiff(); judge(dt < 0 ? 'Too early!' : 'Too late!', 'var(--paper)', 'clamp(34px,9vw,56px)');
    blob.setFace('shock');
    return;
  }
  save.tut = true; $('tapHint').hidden = true;
  const qual = a <= W.p ? 'perfect' : a <= W.gr ? 'great' : 'good';
  const q = 1 - a / W.go;
  const pf = qual === 'perfect' ? 1.18 : qual === 'great' ? 0.94 + 0.06 * q : 0.62 + 0.3 * q;
  const ang = qual === 'perfect' ? 41 : clamp(41 - dt * 170, 14, 70);
  const v = 24 * Math.pow(1.11, lvl('power')) * G.P.ch.power * pf;
  launch(qual, v, ang * Math.PI / 180);
}
function swingBat() { G.bat = { t: 0 }; Sound.swing(); batter.sqv = 1; }
function strike() {
  G.strikes++;
  Sound.strike();
  const out = G.strikes >= 3;
  judge(out ? 'Strike out!' : `Strike ${G.strikes}!`, 'var(--coral)', 'clamp(40px,11vw,72px)');
  renderStrikes();
  shakeCam(0.25);
  setTimeout(() => {
    if (G.mode !== 'pitch') return;
    if (out) { G.mode = 'result'; endSwing(0, true); }
    else { batter.pivot.rotation.z = BAT_REST; G.bat = null; startPitch(); }
  }, 1000);
}
function launch(qual, v, ang) {
  const b = G.b, P = G.P;
  ring.visible = target.visible = targetCore.visible = false;
  G.mode = 'flight';
  b.x = Math.max(b.x, CONTACT.x - 0.2);
  b.vx = Math.cos(ang) * v; b.vy = Math.sin(ang) * v;
  b.rolling = false;
  G.cam.ox = G.cam.x - b.x; G.cam.olx = G.cam.lx - b.x;
  G.hitstop = qual === 'perfect' ? 0.2 : qual === 'great' ? 0.12 : 0.07;
  if (qual === 'perfect') G.slowmo = 0.75;
  Sound.crack(qual);
  shakeCam(qual === 'perfect' ? 1.1 : qual === 'great' ? 0.7 : 0.4);
  flash(qual === 'perfect' ? 0.95 : qual === 'great' ? 0.6 : 0.3, qual === 'perfect' ? 420 : 260);
  judge(qual === 'perfect' ? 'PERFECT!' : qual === 'great' ? 'GREAT!' : 'Good', qual === 'perfect' ? 'var(--sun)' : qual === 'great' ? 'var(--mint)' : 'var(--paper)');
  const n = qual === 'perfect' ? 60 : qual === 'great' ? 34 : 16;
  burst(b.x, b.y, { n, colors: [COLS.gold, COLS.white, COLS.coral], shape: 1, speed: qual === 'perfect' ? 22 : 14, drag: 3, life: 0.8, size: 0.9 });
  burst(b.x, b.y, { n: 14, color: COLS.white, speed: 10, drag: 4, life: 0.4, size: 1.6, grow: 1 });
  b.sqv = -14; b.axis = ang; b.spinT -= Math.PI * 2;
  blob.setFace('wheee');
  batter.setFace('wheee'); batter.faceT = 1.5;
  setTimeout(() => Sound.wheee(1 + (qual === 'perfect' ? 0.15 : 0)), 260);
  $('btnFast').hidden = false;
  $('deckStrip').hidden = true;
  renderStrikes();
  onAirborne();
}

/* =====================================================================
   FLIGHT
   ===================================================================== */
function grav() { return G.P.g * (G.b.x > MOON_AT ? 0.55 : 1); }
function predict() {
  const b = G.b, g = grav();
  const y = Math.max(0, b.y - G.P.R);
  const t = (b.vy + Math.sqrt(b.vy * b.vy + 2 * g * y)) / g;
  const sp = Math.hypot(b.vx, b.vy);
  return { t, x: b.x + b.vx * t / (1 + G.P.k * sp * t * 0.5) };
}
function onAirborne() {
  const b = G.b, F = G.F;
  const pr = predict();
  if (pr.x - b.x < 5) { G.pend = null; return; }
  let type = null;
  if (G.forceNext) { type = G.forceNext; G.forceNext = null; }
  else if (chance(F.helpChance * fatigue())) type = weighted(F.ground);
  else if (chance(0.22 * F.hazard)) type = chance(0.55) ? 'bush' : 'snail';
  G.pend = type ? { type } : null;
}
// helpers get rarer the more of them a single flight has used, so every flight ends
const fatigue = () => Math.pow(0.8, G.b.hits);
// speed boosts shrink as the blob gets faster
const soft = sp => 1 / (1 + (sp / 80) * (sp / 80));
function onRollStart() {
  const b = G.b, F = G.F;
  if (b.vx > 5 && chance(F.helpChance * 0.6 * fatigue())) {
    const g = { ...F.ground }; delete g.pond;
    const type = weighted(g) || 'mushroom';
    const d = clamp(b.vx * b.vx / (2 * G.P.roll) * 0.45, 4, 40);
    spawnObj(type, b.x + d);
  }
}
function nearObj(x, d = 3) { return G.objs.some(o => !o.air && Math.abs(o.x - x) < d); }

function updateFlight(dt) {
  const b = G.b;
  const sp0 = Math.hypot(b.vx, b.vy);
  const sub = Math.ceil(clamp(sp0 * dt / 0.4, 1, 14));
  const h = dt / sub;
  for (let i = 0; i < sub && G.mode === 'flight'; i++) stepPhys(h);
  if (G.mode !== 'flight') return;
  const F = G.F, sp = Math.hypot(b.vx, b.vy);
  b.maxSpeed = Math.max(b.maxSpeed, sp);
  // place the decided helper/hazard right where the blob will land
  if (G.pend && !b.rolling && !b.carry && b.vy < 0) {
    const pr = predict();
    if (pr.t < 0.55) {
      if (!nearObj(pr.x, 3)) spawnObj(G.pend.type, pr.x + (G.pend.type === 'pond' ? rand(-1, 1) : rand(-0.3, 0.3)));
      G.pend = null;
    }
  }
  // sky objects and coin arcs ahead on the flight path
  if (b.x > G.nextAir) {
    G.nextAir = b.x + clamp(14 + sp * 0.35, 14, 90);
    if (!b.rolling && chance(F.airChance * fatigue())) spawnAir();
    if (F.wind > 0 && !b.rolling && chance(F.wind * 0.35 * fatigue())) spawnZone();
  }
  if (b.x > G.nextCoin) {
    G.nextCoin = b.x + clamp(18 + sp * 0.4, 18, 120);
    if (chance(F.coinRate)) spawnCoinArc();
  }
  // random scatter so the field always has life
  while (G.scatterX < b.x + 160) {
    G.scatterX += rand(30, 70);
    if (chance(0.4)) {
      const type = chance(1 - (1 - 0.5 * F.hazard) * fatigue()) ? (chance(0.55) ? 'bush' : 'snail') : weighted(F.ground);
      if (!nearObj(G.scatterX, 6)) spawnObj(type, G.scatterX);
    }
  }
  // biome crossings
  const bi = biomeAt(b.x);
  if (bi > G.biomeSeen) { G.biomeSeen = bi; toast(`~ ${BIOMES[bi].name} ~`); Sound.record(); }
  // passing the record flag
  if (!b.passedBest && save.best > 0 && b.x > save.best) {
    b.passedBest = true;
    judge('NEW RECORD!', 'var(--coral)', 'clamp(40px,11vw,76px)');
    Sound.record(); flash(0.4, 300);
    burst(save.best, 6, { n: 60, colors: CONFETTI, shape: 2, speed: 14, grav: 10, life: 1.6, size: 0.5, drag: 1.5 });
    blob.setFace('love'); b.faceT = 1;
  }
  Sound.setWind(clamp((sp - 8) / 70, 0, 1) * (b.rolling ? 0.3 : 1));
  Sound.setIntensity(1);
  if (!b.rolling) trail.push(b.x, b.y);
  if (sp > 30 && chance(dt * 30)) parts.spawn(b.x - b.vx * 0.02, b.y + rand(-0.4, 0.4), rand(-0.3, 0.6), -b.vx * 0.05, -b.vy * 0.05, 0, { color: COLS.white, size: 0.35, life: 0.4, shape: 1, drag: 3 });
}

function stepPhys(h) {
  const b = G.b, P = G.P;
  if (b.carry) {
    const c = b.carry;
    c.t -= h;
    c.vx += 6 * h * soft(c.vx);
    b.vx = c.vx; b.vy = 3.2;
    b.x += b.vx * h; b.y += b.vy * h;
    c.o.mesh.position.set(b.x, b.y + 1.15, 0);
    c.o.x = b.x; c.o.y = b.y + 1.15;
    if (c.t <= 0) {
      b.carry = null; b.vy = 7;
      c.o.fly = { vx: c.vx * 0.6, vy: 14 };
      onAirborne();
    }
    collect(h);
    return;
  }
  const g = grav();
  b.vy -= g * h;
  const sp = Math.hypot(b.vx, b.vy);
  b.ft = (b.ft || 0) + h;
  const k = P.k + (b.ft > 30 ? (b.ft - 30) * 0.0005 : 0);
  b.vx -= k * sp * b.vx * h; b.vy -= k * sp * b.vy * h;
  for (const z of G.zones) if (b.x > z.x0 && b.x < z.x1 && b.y < z.top) { b.vx += 16 * h * soft(sp); b.vy += 2.5 * h; }
  b.x += b.vx * h; b.y += b.vy * h;
  collide();
  if (G.mode !== 'flight') return;
  if (b.y <= P.R) {
    b.y = P.R;
    if (b.vy < -3.2) {
      const impact = -b.vy;
      b.vy = impact * P.e; b.vx *= P.gf;
      onGroundBounce(impact);
    } else {
      b.vy = 0;
      if (!b.rolling) { b.rolling = true; onRollStart(); }
    }
  } else if (b.rolling && b.y > P.R + 0.05) b.rolling = false;
  if (b.rolling) {
    b.vx = Math.max(0, b.vx - (P.roll + 0.22 * b.vx) * h);
    b.spinT -= b.vx * h / P.R;
    if (b.vx < 0.35) { landed(); return; }
  }
  collect(h);
}
function onGroundBounce(impact) {
  const b = G.b;
  Sound.bounce(impact);
  b.sqv -= clamp(impact * 0.5, 2, 16); b.axis = Math.PI / 2;
  const n = Math.round(clamp(impact * 0.5, 4, 22));
  burst(b.x, 0.2, { n, color: COLS.dust, speed: clamp(impact * 0.25, 2, 10), dir: Math.PI / 2, spread: Math.PI * 0.9, drag: 4, life: 0.6, size: 0.9, grow: 1.2, grav: -1 });
  if (impact > 25) shakeCam(clamp(impact / 120, 0.1, 0.5));
  if (b.chain >= 2) floatText(`Chain ×${b.chain}`, b.x, b.y + 0.6, 'bad');
  b.chain = 0; $('chain').hidden = true;
  if (b.faceT <= 0) blob.setFace(impact > 20 ? 'shock' : 'wheee');
  b.faceT = 0.25;
  onAirborne();
}
function landed() {
  const b = G.b;
  b.vx = 0; b.vy = 0;
  G.mode = 'landed'; G.landT = 0;
  blob.setFace('dizzy'); b.faceT = 99;
  b.spinT = Math.round(b.spin / (Math.PI * 2)) * Math.PI * 2;
  Sound.land(); Sound.setWind(0); Sound.setIntensity(0);
  $('btnFast').hidden = true; G.fast = false;
  burst(b.x, 0.3, { n: 10, color: COLS.dust, speed: 3, drag: 3, life: 0.8, size: 1, grow: 1 });
  for (let i = 0; i < 3; i++) burst(b.x, b.y + 1.2, { n: 1, color: COLS.gold, shape: 1, speed: 1, life: 1.2, size: 0.6 });
}

/* ---------------- spawning ---------------- */
function spawnObj(type, x, y = 0) {
  let mesh, r = 1.2, cy = 1, air = false;
  const o = { type, x, y, used: false, t: 0, pop: 0 };
  switch (type) {
    case 'mushroom': o.mega = has('megashroom'); mesh = makeMushroom(o.mega); r = o.mega ? 2.0 : 1.3; cy = o.mega ? 2.5 : 1.55; break;
    case 'spring': mesh = makeSpring(); r = 1.0; cy = 0.75; break;
    case 'frog': o.lily = has('lilyleap'); mesh = makeFrog(o.lily); r = 1.35; cy = 0.75; break;
    case 'pond': o.geyser = has('geysers'); mesh = makePond(o.geyser); r = 4.2; cy = 0; break;
    case 'rocket': mesh = makeRocket(true); r = 1.3; cy = 1.0; break;
    case 'bush': o.berries = has('berries'); mesh = makeBush(o.berries); r = 1.2; cy = 0.7; break;
    case 'snail': mesh = makeSnail(); r = 0.8; cy = 0.5; break;
    case 'balloon':
      if (has('kites')) { o.type = 'kite'; mesh = makeKite(); r = 1.7; } else { mesh = makeBalloon(); r = 1.2; }
      air = true; cy = 0; break;
    case 'bird': mesh = makeBird(); r = 1.5; cy = 0; air = true; break;
    case 'cloud': mesh = makeCloudPlat(); r = 2.0; cy = 0; air = true; break;
    case 'airrocket': mesh = makeRocket(false); r = 1.4; cy = 0; air = true; o.type = 'rocket'; break;
    default: return null;
  }
  o.r = r; o.cy = cy; o.air = air; o.mesh = mesh; o.base = mesh.scale.x;
  o.seed = rand(0, 10);
  mesh.position.set(x, y, 0);
  mesh.scale.setScalar(0.001);
  if (!air) { const sh = makeShadow(r * 0.9); sh.position.set(0, 0.03, 0); mesh.add(sh); }
  scene.add(mesh);
  G.objs.push(o);
  return o;
}
function spawnAir() {
  const b = G.b, F = G.F;
  let type = weighted(F.air); if (!type) return;
  if (type === 'rocket') type = 'airrocket';
  const sp = Math.hypot(b.vx, b.vy);
  const L = clamp(sp * 0.9, 16, 130);
  if (b.vx < 4) return;
  const t = L / b.vx, g = grav();
  const y = b.y + b.vy * t - 0.5 * g * t * t;
  if (y < 3.5) return;
  spawnObj(type, b.x + L, y + rand(-1.6, 1.6));
}
function spawnCoinArc() {
  const b = G.b; if (b.vx < 4) return;
  const sp = Math.hypot(b.vx, b.vy), g = grav();
  const L = clamp(sp * 0.7, 10, 100), dx = clamp(sp * 0.07, 1.4, 6);
  const n = 6 + ((Math.random() * 5) | 0);
  const big = has('goldrush');
  for (let i = 0; i < n; i++) {
    const t = (L + i * dx) / b.vx;
    let y = b.y + b.vy * t - 0.5 * g * t * t;
    if (b.rolling || y < 1.2) y = 1.2 + Math.sin(i / (n - 1) * Math.PI) * 2;
    const mesh = makeCoin(big);
    mesh.position.set(b.x + L + i * dx, y, 0);
    scene.add(mesh);
    G.coins.push({ x: mesh.position.x, y, mesh, val: big ? 3 : 1, taken: false, t: 0, ph: i * 0.4 });
  }
}
function spawnZone() {
  const b = G.b, sp = Math.hypot(b.vx, b.vy);
  const x0 = b.x + clamp(sp * 0.8, 15, 110), len = 30 + sp * 0.6;
  const mesh = makeWindStreaks();
  mesh.position.set(x0, 0, 0);
  const top = Math.max(b.y + 30, 40);
  mesh.userData.len = len; mesh.userData.top = top;
  scene.add(mesh);
  G.zones.push({ x0, x1: x0 + len, top, mesh, t: 0 });
}

/* ---------------- collisions & effects ---------------- */
function collide() {
  const b = G.b, P = G.P;
  for (const o of G.objs) {
    if (o.used || o.cool > 0) continue;
    const dx = b.x - o.x;
    if (Math.abs(dx) > o.r + 3) continue;
    if (o.type === 'pond') {
      if (Math.abs(dx) < 4.0 && b.y <= P.R + 0.12 && b.vy <= 0) trigger(o);
      continue;
    }
    const dy = b.y - (o.y + o.cy);
    const rr = o.r + P.R * 0.8;
    if (dx * dx + dy * dy < rr * rr) trigger(o);
    if (G.mode !== 'flight') return;
  }
}
function helperHit(o, label, big) {
  const b = G.b;
  b.chain++; b.hits++;
  const bonus = b.chain;
  b.chainCoins += bonus;
  floatText(label, o.x, o.y + (o.cy || 0) + 1, big ? 'big' : '');
  if (b.chain >= 2) {
    const el = $('chain'); el.hidden = false; el.textContent = `Chain ×${b.chain}`;
    el.animate([{ transform: 'scale(1.5) rotate(-6deg)' }, { transform: 'scale(1) rotate(0)' }], { duration: 300, easing: 'cubic-bezier(.2,1.6,.4,1)' });
  }
  blob.setFace('wheee'); b.faceT = 0.6;
  b.spinT -= Math.PI * 2 * (b.chain % 3 === 0 ? 1 : 0);
  b.rolling = false;
}
function trigger(o) {
  const b = G.b, P = G.P, ch = P.ch;
  const sp = Math.hypot(b.vx, b.vy);
  o.used = true; o.t = 0;
  switch (o.type) {
    case 'mushroom': {
      const m = (o.mega ? 1.5 : 1) * ch.mush;
      b.vy = Math.max(Math.abs(b.vy) * 0.9, 13 + 0.22 * sp) * m;
      b.vx += (b.vx * 0.07 + 2) * soft(sp);
      b.y = Math.max(b.y, o.y + o.cy + 0.2);
      Sound.boing(o.mega ? 0.75 : 1);
      burst(o.x, o.cy + 0.6, { n: o.mega ? 30 : 18, colors: [COLS.coral, COLS.white, COLS.gold], shape: 1, speed: 10, drag: 3, life: 0.7, size: 0.7 });
      helperHit(o, o.mega ? 'MEGA BOING!' : 'BOING!', o.mega);
      b.sqv -= 10; b.axis = Math.PI / 2;
      shakeCam(o.mega ? 0.5 : 0.2);
      break;
    }
    case 'spring':
      b.vy = Math.max(Math.abs(b.vy), 17 + 0.2 * sp) * ch.mush; b.vx += b.vx * 0.05 * soft(sp);
      b.y = Math.max(b.y, 1.2);
      Sound.boing(1.3);
      burst(o.x, 1, { n: 14, colors: [COLS.mint, COLS.white], shape: 1, speed: 8, drag: 3, life: 0.6, size: 0.6 });
      helperHit(o, 'SPROING!'); b.sqv -= 9; b.axis = Math.PI / 2;
      break;
    case 'frog': {
      const s = Math.max(sp + (sp * 0.22 + 4) * soft(sp), 24) * (o.lily ? 1 + 0.12 * soft(sp) : 1), a = 0.66;
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; b.y = Math.max(b.y, 1.2);
      Sound.ribbit();
      burst(o.x, 1, { n: 14, colors: [COLS.mint, COLS.leaf, COLS.white], speed: 9, drag: 3, life: 0.6, size: 0.6 });
      helperHit(o, 'RIBBIT!', true);
      if (o.lily && chance(0.75)) G.forceNext = 'frog';
      shakeCam(0.3);
      break;
    }
    case 'pond':
      if (o.geyser) {
        b.vy = 26 + 0.25 * sp; b.vx += b.vx * 0.06 * soft(sp); b.y = P.R + 0.2;
        Sound.geyser(); o.blast = 1;
        burst(o.x, 0.5, { n: 40, color: COLS.water, speed: 16, dir: Math.PI / 2, spread: 0.8, grav: 20, drag: 1, life: 1.1, size: 0.8 });
        helperHit(o, 'WHOOSH!', true); shakeCam(0.4);
      } else if (b.vx > 10 && Math.abs(b.vy) < b.vx * 1.2) {
        b.vy = 5 + b.vx * 0.18; b.vx *= 0.97; b.y = P.R + 0.15;
        Sound.skip(); o.used = false; o.cool = 0.25;
        burst(b.x, 0.2, { n: 14, color: COLS.water, speed: 7, dir: Math.PI / 2, spread: 1.4, grav: 18, drag: 1, life: 0.6, size: 0.5 });
        helperHit(o, 'SKIP!');
      } else {
        b.vx *= 0.55; b.vy = 4; b.y = P.R + 0.15;
        Sound.splash(); blob.setFace('shock'); b.faceT = 0.6;
        burst(b.x, 0.2, { n: 24, color: COLS.water, speed: 8, dir: Math.PI / 2, spread: 1.2, grav: 18, drag: 1, life: 0.7, size: 0.6 });
        floatText('SPLASH', o.x, 0.6, 'bad'); b.chain = 0; $('chain').hidden = true;
      }
      break;
    case 'rocket': {
      const s = sp + (sp * 0.35 + 18) * soft(sp), a = 0.62;
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; b.y = Math.max(b.y, o.y + 0.8);
      Sound.rocket(); o.fly = { vx: s * 0.5, vy: s * 0.4 };
      burst(o.x, o.y + 1, { n: 50, colors: CONFETTI, shape: 1, speed: 20, drag: 2.5, life: 1.0, size: 0.8 });
      helperHit(o, 'FWOOSH!', true); shakeCam(0.7); flash(0.35, 200);
      break;
    }
    case 'bush':
      if (o.berries) {
        b.vx *= 0.92; b.vy = Math.max(b.vy, 3);
        const v = 5 * ch.coin * (has('goldrush') ? 3 : 1); b.coins += v;
        Sound.coin(G.coinStreak++); Sound.bushy();
        floatText(`+${v} berries`, o.x, 1.4, 'coin');
        burst(o.x, 1, { n: 16, colors: [COLS.coral, COLS.leaf], speed: 7, grav: 14, drag: 1, life: 0.8, size: 0.5 });
        o.berryGone = true;
      } else {
        b.vx *= 1 - 0.5 * ch.bush; b.vy *= 0.3;
        Sound.bushy(); blob.setFace('ouch'); b.faceT = 0.7;
        burst(o.x, 1, { n: 22, color: COLS.leaf, speed: 8, grav: 12, drag: 1.5, life: 0.9, size: 0.55, shape: 2 });
        floatText('RUSTLE', o.x, 1.2, 'bad'); b.chain = 0; $('chain').hidden = true;
      }
      o.shake = 1;
      break;
    case 'snail':
      b.vx *= 1 - 0.32 * ch.bush; b.vy = Math.max(b.vy, 5);
      Sound.bonk(); Sound.oof(); blob.setFace('ouch'); b.faceT = 0.7;
      burst(o.x, 1, { n: 10, color: COLS.white, shape: 1, speed: 6, drag: 3, life: 0.5, size: 0.5 });
      floatText('BONK', o.x, 1, 'bad'); b.chain = 0; $('chain').hidden = true;
      o.squish = 1;
      break;
    case 'balloon': {
      b.vy = Math.max(b.vy, 0) + 12; b.vx += b.vx * 0.05 * soft(sp);
      Sound.pop();
      const col = new THREE.Color(o.mesh.userData.color);
      burst(o.x, o.y, { n: 18, color: col, shape: 2, speed: 10, grav: 10, drag: 1.5, life: 0.9, size: 0.45 });
      o.mesh.visible = false;
      if (has('skyrockets')) {
        b.vx += (b.vx * 0.25 + 10) * soft(sp); b.vy += 6;
        Sound.rocket(); burst(o.x, o.y, { n: 60, colors: CONFETTI, shape: 1, speed: 24, drag: 2.5, life: 1.1, size: 0.8 });
        helperHit(o, 'KABOOM!', true); shakeCam(0.6); flash(0.3, 200);
      } else helperHit(o, 'POP!');
      break;
    }
    case 'kite':
      b.vx += (16 + sp * 0.08) * soft(sp); b.vy = Math.max(b.vy, 0) + 9;
      Sound.chirp(); Sound.wheee(1.2); o.fly = { vx: b.vx * 0.8, vy: 10 };
      burst(o.x, o.y, { n: 16, colors: [COLS.gold, COLS.white], shape: 1, speed: 8, drag: 3, life: 0.6, size: 0.6 });
      helperHit(o, 'WHEEE!', true);
      break;
    case 'bird': {
      const flock = has('flock');
      b.carry = { o, t: flock ? 2.4 : 1.1, vx: Math.max(b.vx, 24) * (flock ? 1 + 0.15 * soft(sp) : 1) };
      o.carrying = true;
      Sound.chirp();
      helperHit(o, flock ? 'FLOCK RIDE!' : 'TWEET!', flock);
      break;
    }
    case 'cloud':
      if (b.vy < 0) {
        b.vy = -b.vy * 0.85 + 9; b.vx += b.vx * 0.04 * soft(sp); b.y = Math.max(b.y, o.y + 1.4);
        Sound.boing(0.6); o.squish = 1;
        burst(o.x, o.y + 1, { n: 16, color: COLS.white, speed: 7, drag: 3, life: 0.6, size: 1, grow: 0.8 });
        helperHit(o, 'FLUMP!');
      } else { o.used = false; o.cool = 0.4; }
      break;
  }
}
function collect(h) {
  const b = G.b, P = G.P;
  const mr = 1.1 * G.F.magnet;
  for (const c of G.coins) {
    if (c.taken) continue;
    const dx = b.x - c.x, dy = b.y - c.y, d2 = dx * dx + dy * dy;
    if (G.F.magnet > 1 && d2 < (mr * 2.4) * (mr * 2.4)) {
      const d = Math.sqrt(d2) || 1, s = Math.min(d, (30 + Math.hypot(b.vx, b.vy)) * h);
      c.x += dx / d * s; c.y += dy / d * s;
    }
    if (d2 < (P.R + 0.6 + (mr - 1.1) * 0.3) ** 2) {
      c.taken = true; c.mesh.visible = false;
      const v = c.val * P.ch.coin;
      b.coins += v;
      Sound.coin(G.coinStreak++); G.coinStreakT = 0.6;
      burst(c.x, c.y, { n: 6, colors: [COLS.gold, COLS.white], shape: 1, speed: 5, drag: 3, life: 0.4, size: 0.45 });
      if (v > 1) floatText('+' + v, c.x, c.y, 'coin');
    }
  }
}

/* ---------------- object animation & cleanup ---------------- */
function updateObjects(dt, camX) {
  const t = G.time;
  for (let i = G.objs.length - 1; i >= 0; i--) {
    const o = G.objs[i], m = o.mesh;
    o.t += dt; o.pop = Math.min(1, o.pop + dt / 0.35);
    if (o.cool > 0) o.cool -= dt;
    let s = o.base * easeOutBack(o.pop);
    switch (o.type) {
      case 'mushroom': if (o.used) { const k = Math.exp(-o.t * 6) * Math.sin(o.t * 30); m.scale.set(s * (1 + k * 0.25), s * (1 - k * 0.35), s * (1 + k * 0.25)); s = -1; } break;
      case 'spring': { const c = m.userData.coils; const k = o.used ? Math.exp(-o.t * 5) * Math.sin(o.t * 28) : 0; c.scale.y = 1 + k * 0.6; break; }
      case 'frog': {
        const bd = m.userData.body; bd.scale.y = 1 + Math.sin(t * 3 + o.seed) * 0.04;
        if (o.used) { const k = Math.max(0, 1 - o.t * 3); m.userData.tongue.scale.x = Math.sin(k * Math.PI) * 2.2 + 0.001; bd.position.y = (o.lily ? 0.1 : 0) + Math.max(0, Math.sin(Math.min(1, o.t * 2.5) * Math.PI)) * 0.8; }
        break;
      }
      case 'pond': {
        const col = m.userData.col;
        if (o.blast) { o.blast = Math.max(0, o.blast - dt * 0.8); col.visible = true; col.scale.set(1, 0.001 + Math.sin((1 - o.blast) * Math.PI) * 9, 1); }
        else col.visible = false;
        break;
      }
      case 'bush': if (o.shake) { o.shake = Math.max(0, o.shake - dt * 2.5); m.rotation.z = Math.sin(o.t * 40) * 0.12 * o.shake; } if (o.berryGone) m.userData.berries.forEach(b => b.visible = false); break;
      case 'snail': if (o.squish) { o.squish = Math.max(0, o.squish - dt * 2); m.scale.set(s * (1 + o.squish * 0.3), s * (1 - o.squish * 0.4), s); s = -1; } break;
      case 'balloon': m.position.y = o.y + Math.sin(t * 2 + o.seed) * 0.3; m.rotation.z = Math.sin(t * 1.3 + o.seed) * 0.08; break;
      case 'kite': m.userData.k.rotation.z = -0.5 + Math.sin(t * 2.5 + o.seed) * 0.15; break;
      case 'cloud': m.position.y = o.y + Math.sin(t * 1.4 + o.seed) * 0.25; if (o.squish) { o.squish = Math.max(0, o.squish - dt * 2.5); m.scale.set(s * (1 + o.squish * 0.2), s * (1 - o.squish * 0.3), s); s = -1; } break;
      case 'bird':
        for (const [w, sd] of m.userData.wings) w.rotation.x = sd * Math.sin(t * (o.carrying ? 26 : 14) + o.seed) * 0.8;
        if (!o.used) m.position.y = o.y + Math.sin(t * 3 + o.seed) * 0.4;
        break;
      case 'rocket': if (!o.used && o.air) m.position.y = o.y + Math.sin(t * 2.2 + o.seed) * 0.25; break;
    }
    if (o.fly) {
      o.fly.vy -= 4 * dt;
      m.position.x += o.fly.vx * dt; m.position.y += o.fly.vy * dt;
      if (o.type === 'rocket' && chance(dt * 40)) parts.spawn(m.position.x, m.position.y, 0, rand(-2, 2), rand(-4, -1), 0, { color: pick([COLS.gold, COLS.coral, COLS.white]), size: 0.6, life: 0.5, shape: 1 });
    }
    if (s >= 0) m.scale.setScalar(s);
    if (o.type === 'bird' && o.used && !o.carrying) {/* flying off */}
    if (o.fly && o.carrying) o.carrying = false;
    if (m.position.x < camX - 90 || m.position.y > G.cam.y + 200) { scene.remove(m); G.objs.splice(i, 1); }
  }
  for (let i = G.coins.length - 1; i >= 0; i--) {
    const c = G.coins[i];
    c.mesh.rotation.y = t * 4 + c.ph;
    c.mesh.position.set(c.x, c.y + Math.sin(t * 3 + c.ph) * 0.12, 0);
    if (c.x < camX - 90) { scene.remove(c.mesh); G.coins.splice(i, 1); }
  }
  for (let i = G.zones.length - 1; i >= 0; i--) {
    const z = G.zones[i]; z.t += dt;
    const st = z.mesh.userData.streaks, len = z.mesh.userData.len;
    for (const s of st) {
      const o = s.userData.o;
      o[0] = (o[0] + dt * 0.9) % 1;
      s.position.set(o[0] * len, 1 + o[1] * Math.min(z.top, G.b.y + 14), o[2] * 3);
      s.material.opacity = 0.55;
    }
    if (z.x1 < camX - 90) { scene.remove(z.mesh); G.zones.splice(i, 1); }
  }
  if (G.coinStreakT > 0) { G.coinStreakT -= dt; if (G.coinStreakT <= 0) G.coinStreak = 0; }
}

/* =====================================================================
   RESULTS
   ===================================================================== */
function endSwing(dist, out) {
  const run = G.run, b = G.b;
  run.dists.push(dist); run.swing++;
  const cm = 1 + 0.25 * lvl('coins');
  const fromDist = Math.floor(dist * 0.25 * cm);
  const pickups = Math.floor(b.coins * cm);
  const chainB = Math.floor(b.chainCoins * cm);
  const prevBest = save.best;
  const isBest = dist > prevBest && !out;
  const bestB = isBest ? Math.floor((10 + dist * 0.15) * cm) : 0;
  const total = fromDist + pickups + chainB + bestB;
  save.coins += total; run.coins += total; save.swings++;
  if (isBest) save.best = dist;
  persist();
  showHud(false);
  const el = $('scrResult');
  const last = run.swing >= run.swings;
  el.innerHTML = `<div class="panel">
      <h2>${out ? 'Struck out' : `Swing ${run.swing} of ${run.swings}`}</h2>
      <div class="bigdist" id="resDist">0<small> m</small></div>
      ${isBest ? '<div class="newbest">New best!</div>' : ''}
      <div class="lines">
        <div class="line"><span>Distance</span><span>+${fmt(fromDist)} <i class="coin-ico"></i></span></div>
        <div class="line"><span>Coins picked up</span><span>+${fmt(pickups)} <i class="coin-ico"></i></span></div>
        ${chainB ? `<div class="line"><span>Chain bonus</span><span>+${fmt(chainB)} <i class="coin-ico"></i></span></div>` : ''}
        ${bestB ? `<div class="line"><span>Record bonus</span><span>+${fmt(bestB)} <i class="coin-ico"></i></span></div>` : ''}
        <div class="line total"><span>Total</span><span id="resTotal">+0 <i class="coin-ico"></i></span></div>
      </div>
      <button class="btn ${last ? 'coral' : ''}" id="btnNext">${last ? 'Finish run' : 'Next swing'}</button>
    </div>`;
  setScreen('result');
  const t0 = performance.now(), dur = clamp(600 + dist * 1.2, 700, 1600);
  let ticks = 0;
  const step = now => {
    const k = clamp((now - t0) / dur, 0, 1), e = easeOutCubic(k);
    const d = $('resDist'), tt = $('resTotal');
    if (!d) return;
    d.innerHTML = `${fmtDist(dist * e)}<small> m</small>`;
    tt.innerHTML = `+${fmt(total * e)} <i class="coin-ico"></i>`;
    if (Math.floor(e * 24) > ticks) { ticks = Math.floor(e * 24); Sound.tick(ticks); }
    if (k < 1) requestAnimationFrame(step);
    else {
      d.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'cubic-bezier(.2,1.6,.4,1)' });
      if (isBest) { Sound.record(); burst(G.b.x, 2, { n: 70, colors: CONFETTI, shape: 2, speed: 14, grav: 9, life: 2, size: 0.5, drag: 1.2 }); blob.setFace('love'); }
      else Sound.buy();
    }
  };
  requestAnimationFrame(step);
  $('btnNext').onclick = () => { Sound.ui(); if (last) showSummary(); else startDraft(); };
}
function showSummary() {
  const run = G.run;
  const far = Math.max(0, ...run.dists);
  const affordable = UPS.filter(u => lvl(u.id) < u.max && upCost(u) <= save.coins).length;
  const el = $('scrSummary');
  el.innerHTML = `<div class="panel">
    <h2>Run complete!</h2>
    <div class="bigdist">${fmtDist(far)}<small> m</small></div>
    <div class="lines">
      <div class="line"><span>Farthest swing</span><span>${fmtDist(far)} m</span></div>
      <div class="line"><span>Coins earned</span><span>+${fmt(run.coins)} <i class="coin-ico"></i></span></div>
      <div class="line"><span>Combos made</span><span>${run.combos.length ? run.combos.map(id => COMBOS.find(c => c.id === id).name).join(', ') : 'None yet'}</span></div>
      <div class="line"><span>Upgrades you can buy</span><span>${affordable}</span></div>
    </div>
    <button class="btn coral" id="btnHub">Back to the clubhouse</button>
  </div>`;
  G.mode = 'summary';
  setScreen('summary');
  Sound.combo();
  $('btnHub').onclick = () => { Sound.ui(); goHub(); if (affordable) setTimeout(() => openSheet('sheetShop'), 250); };
}

/* =====================================================================
   CAMERA & VISUALS
   ===================================================================== */
function shakeCam(a) { G.shake = Math.max(G.shake, a); }
function updateCamera(dt) {
  const c = G.cam, b = G.b, k = G.aspectK;
  let tx, ty, tz, lx, ly, rate = 4;
  if (G.mode === 'flight' || G.mode === 'landed' || G.mode === 'result' || G.mode === 'summary') {
    const sp = Math.hypot(b.vx, b.vy);
    tz = clamp(8.5 + sp * 0.075 + b.y * 0.25, 8.5, 55) * (1 + (k - 1) * 0.55);
    // keep the blob in the left third of the frame, whatever the screen shape
    const halfW = c.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
    const lead = Math.min(clamp(b.vx * 0.22, 0, 30), halfW * 0.45);
    let ox = lead * 0.4, olx = lead;
    ty = b.y * 0.88 + 2.2 + tz * 0.05; ly = b.y * 0.94 + 0.8;
    rate = 4 + Math.abs(b.vy) * 0.15;
    if (G.mode !== 'flight') { tz = 9 * k; ty = 2.6; ly = 1.0; ox = 0.5; olx = 0; rate = 2.5; }
    c.ox = damp(c.ox, ox, 3, dt); c.olx = damp(c.olx, olx, 3, dt);
    c.x = b.x + c.ox; c.lx = b.x + c.olx;
    c.y = damp(c.y, ty, rate, dt); c.z = damp(c.z, tz, Math.min(rate, 5), dt); c.ly = damp(c.ly, ly, rate, dt);
  } else {
    if (G.mode === 'pitch') { tx = 2.6 + 0.4 / k; ty = 2.3; tz = 9.4 * k; lx = 1.2 + 0.8 / k; ly = 1.7; }
    else { tx = 1.6 + Math.sin(G.time * 0.3) * 0.4; ty = 2.4; tz = 11 * k; lx = 1.0; ly = k > 1.2 ? 1.6 : 0.4; }
    c.x = damp(c.x, tx, 3, dt); c.y = damp(c.y, ty, 3, dt); c.z = damp(c.z, tz, 3, dt); c.lx = damp(c.lx, lx, 3, dt); c.ly = damp(c.ly, ly, 3, dt);
  }
  G.shake = Math.max(0, G.shake - dt * 2.2);
  const s = G.shake * G.shake * 0.8;
  camera.position.set(c.x + rand(-s, s), c.y + rand(-s, s), c.z);
  camera.lookAt(c.lx + rand(-s, s) * 0.5, c.ly + rand(-s, s) * 0.5, 0);
  sky.position.copy(camera.position);
  sunLight.position.set(camera.position.x - 6, camera.position.y + 12, 10);
  sunLight.target.position.set(camera.position.x, camera.position.y, 0);
}
function updateBlobVisual(dt, sdt) {
  const b = G.b, P = G.P || physParams();
  if (G.mode === 'hub' || G.mode === 'title' || G.mode === 'draft' || G.mode === 'boot') {
    const ph = (G.time * 1.6) % 1;
    b.x = 3.4; b.y = P.R + Math.sin(ph * Math.PI) * 0.9;
    if (ph < 0.06 && !b.hopped) { b.hopped = true; b.sqv -= 5; b.axis = Math.PI / 2; }
    if (ph > 0.5) b.hopped = false;
  }
  blob.root.position.set(b.x, b.y, 0);
  const sp = Math.hypot(b.vx, b.vy);
  const tgt = G.mode === 'flight' && !b.rolling ? clamp(sp * 0.0045, 0, 0.32) : 0;
  b.sqv += ((tgt - b.sq) * 160 - b.sqv * 10) * dt;
  b.sq += b.sqv * dt;
  const s = clamp(b.sq, -0.45, 0.6);
  if (G.mode === 'flight' && sp > 2 && b.axis !== Math.PI / 2) b.axis = Math.atan2(b.vy, b.vx);
  else if (G.mode === 'flight' && sp > 2 && Math.abs(b.sqv) < 2) b.axis = Math.atan2(b.vy, b.vx);
  blob.squash.rotation.z = b.axis;
  const inv = 1 / Math.sqrt(1 + s);
  blob.squash.scale.set(1 + s, inv, inv);
  b.spin = damp(b.spin, b.spinT, 7, sdt);
  blob.inner.rotation.z = -b.axis + b.spin;
  blob.uni.uTime.value += dt;
  blob.uni.uWob.value = 0.025 + Math.min(0.05, Math.abs(b.sqv) * 0.004);
  blob.facePlane.position.x = clamp(b.vx * 0.004, -0.08, 0.12);
  if (b.faceT > 0 && b.faceT < 50) { b.faceT -= dt; if (b.faceT <= 0 && G.mode === 'flight') blob.setFace('wheee'); }
  if (G.mode === 'hub' && b.faceT <= 0 && save.chars[CHARS[G.charIdx].id]) blob.setFace(Math.sin(G.time * 0.9) > 0.97 ? 'blink' : 'idle');
  // shadow
  const hgt = Math.max(0, b.y - P.R);
  blobShadow.position.set(b.x, 0.03, 0);
  blobShadow.scale.setScalar(P.R * 1.3 * (1 - clamp(hgt / 30, 0, 0.7)));
  blobShadow.material.opacity = 0.9 * (1 - clamp(hgt / 40, 0, 0.85));
  // batter
  batter.uni.uTime.value += dt;
  if (G.bat) {
    const t = (G.bat.t += sdt > 0 ? dt : dt * 0.15);
    const a = t < 0.07 ? lerp(BAT_REST, 0, easeOutCubic(t / 0.07)) : t < 0.24 ? lerp(0, -1.25, easeOutCubic((t - 0.07) / 0.17)) : -1.25 + Math.sin(Math.min(1, (t - 0.24) * 3) * Math.PI) * 0.08;
    batter.pivot.rotation.z = a;
    batter.squash.scale.set(1 + Math.sin(t * 20) * Math.exp(-t * 5) * 0.12, 1 - Math.sin(t * 20) * Math.exp(-t * 5) * 0.1, 1);
  } else {
    batter.pivot.rotation.z = BAT_REST + Math.sin(G.time * 2.4) * 0.06;
    const br = Math.sin(G.time * 2.4) * 0.03;
    batter.squash.scale.set(1 + br, 1 - br, 1);
  }
  if (batter.faceT > 0) { batter.faceT -= dt; if (batter.faceT <= 0) batter.setFace('ready'); }
}

/* speed lines on a 2D overlay */
const fx = $('fx'), fxg = fx.getContext('2d');
const lines = Array.from({ length: 28 }, () => ({ x: Math.random(), y: Math.random(), l: rand(0.08, 0.25), s: rand(0.8, 1.6) }));
function drawSpeedLines(dt) {
  const w = fx.width, h = fx.height;
  fxg.clearRect(0, 0, w, h);
  const b = G.b, sp = Math.hypot(b.vx, b.vy);
  const a = G.mode === 'flight' ? clamp((sp - 32) / 90, 0, 0.55) : 0;
  if (a <= 0.01) return;
  const ang = Math.atan2(b.vy, b.vx) * 0.6;
  fxg.save(); fxg.translate(w / 2, h / 2); fxg.rotate(-ang); fxg.translate(-w / 2, -h / 2);
  fxg.lineCap = 'round';
  for (const L of lines) {
    L.x -= dt * L.s * (0.6 + sp / 80);
    if (L.x + L.l < -0.1) { L.x = 1.1; L.y = Math.random(); L.l = rand(0.08, 0.25); }
    const yy = L.y * h;
    if (Math.abs(yy - h / 2) < h * 0.12) continue;
    fxg.strokeStyle = `rgba(255,255,255,${a})`; fxg.lineWidth = 3 * PR;
    fxg.beginPath(); fxg.moveTo(L.x * w, yy); fxg.lineTo((L.x + L.l) * w, yy); fxg.stroke();
  }
  fxg.restore();
}

/* =====================================================================
   INPUT, RESIZE, LOOP
   ===================================================================== */
function onTap() {
  Sound.init();
  if (G.mode === 'title') { Sound.ui(); goHub(); }
  else if (G.mode === 'pitch') tryHit();
}
$('game').addEventListener('pointerdown', e => {
  if (e.target.closest('button, .sheet, #comboReveal, .panel')) return;
  if (G.mode === 'draft' || G.mode === 'hub') return;
  onTap();
});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    if (G.mode === 'pitch' || G.mode === 'title') { e.preventDefault(); onTap(); }
  }
  if (e.code === 'Escape') closeSheets();
});
$('btnMute').onclick = $('btnMute2').onclick = toggleMute;
$('btnFast').onclick = () => { G.fast = !G.fast; $('btnFast').classList.toggle('on', G.fast); Sound.ui(); };
$('btnPlay').onclick = () => { if (!save.chars[CHARS[G.charIdx].id]) { Sound.nope(); return; } newRun(); };
$('btnShop').onclick = () => openSheet('sheetShop');
$('btnBook').onclick = () => openSheet('sheetBook');
$('charPrev').onclick = () => cycleChar(-1);
$('charNext').onclick = () => cycleChar(1);
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { Sound.ui(); closeSheets(); });
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('pointerdown', e => { if (e.target === s) closeSheets(); }));

function resize() {
  const w = glCanvas.clientWidth || window.innerWidth, h = glCanvas.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  G.aspectK = Math.pow(clamp(1.25 / camera.aspect, 1, 2.4), 0.6);
  parts.uni.uScale.value = h * PR / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  fx.width = w * PR; fx.height = h * PR;
}
window.addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.time += dt;
  let sdt = dt;
  if (G.hitstop > 0) { G.hitstop -= dt; sdt = 0; }
  else if (G.slowmo > 0) { G.slowmo -= dt; sdt = dt * lerp(1, 0.22, clamp(G.slowmo / 0.75, 0, 1)); }
  if (G.mode === 'flight') sdt *= clamp(1 + ((G.b.ft || 0) - 12) * 0.05, 1, 2) * (G.fast ? 2.5 : 1);
  if (G.mode === 'pitch') updatePitch(sdt);
  else if (G.mode === 'flight') updateFlight(sdt);
  else if (G.mode === 'landed') { G.landT += dt; if (G.landT > 1.1 && G.run) { G.mode = 'result'; endSwing(Math.max(0, G.b.x)); } }
  updateObjects(sdt, G.cam.x);
  parts.update(sdt);
  updateBlobVisual(dt, sdt);
  if (G.mode === 'flight') trail.fade = 1; else if (G.mode !== 'pitch') trail.fade = Math.max(0, trail.fade - dt * 1.5);
  trail.build(G.P ? G.P.R * 1.05 : 0.7);
  updateCamera(dt);
  ground.position.x = G.cam.x;
  updateScenery(G.cam.x, G.cam.y, false);
  updateSigns(G.cam.x);
  applyBiome(Math.max(0, G.cam.lx));
  updateFloaters(dt);
  drawSpeedLines(dt);
  if (G.mode === 'flight' || G.mode === 'landed') {
    $('hudDist').innerHTML = `${fmtDist(Math.max(0, G.b.x))}<small>m</small>`;
    $('hudCoins').textContent = fmt(save.coins + Math.floor(G.b.coins));
  } else if (G.mode === 'pitch') $('hudDist').innerHTML = `0<small>m</small>`;
  // rain ambience
  if (G.F && G.F.slick > 0 && G.mode !== 'hub' && G.mode !== 'title') {
    G.rainT += dt * 60 * Math.min(2, G.F.slick / 0.06);
    while (G.rainT > 1) { G.rainT--; parts.spawn(camera.position.x + rand(-25, 35), camera.position.y + rand(8, 18), rand(-12, 4), -3, -30, 0, { color: COLS.sky, size: 0.9, life: 0.8, shape: 3, drag: 0 }); }
  }
  renderer.render(scene, camera);
}

/* =====================================================================
   BOOT
   ===================================================================== */
resize();
updateScenery(0, 0, true);
applyBiome(0);
renderMute();
G.thumbs = makeThumbs();
G.mode = 'title';
window.__bonk = { G, tryHit, save, updateFlight, launch, computeField, physParams, resetWorld, spawnObj };
G.F = computeField(); G.P = physParams();
resetWorld();
setScreen('title');
requestAnimationFrame(t => { last = t; frame(t); });
$('scrTitle').addEventListener('click', () => { if (G.mode === 'title') onTap(); });
document.fonts && document.fonts.ready.then(() => {
  // redraw canvas labels once the display font has loaded
  const c = startArea.userData.signC, g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = '#ff6b6b'; g.beginPath(); g.roundRect(8, 8, 496, 144, 36); g.fill();
  g.lineWidth = 12; g.strokeStyle = '#3a2748'; g.stroke();
  g.font = '96px "Bagel Fat One", Fredoka, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 14; g.strokeText('BONK!', 256, 86); g.fillStyle = '#fffaf0'; g.fillText('BONK!', 256, 86);
  startArea.userData.signTex.needsUpdate = true;
  for (const s of signs) s.userData.k = -1;
  placeBestFlag();
});
</script>
