<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1130" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbe6cc" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<title>Ember &amp; Hex</title>
<style>
/* ===================== THEME TOKENS ===================== */
:root {
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --bg: #fbe6cc;
  --text: #2a170c;
  --muted: #5a3a24;
  --panel: rgba(255, 248, 236, 0.94);
  --panel-2: rgba(255, 238, 214, 0.96);
  --panel-line: rgba(160, 96, 30, 0.35);
  --gold: #9a5600;
  --gold-hi: #c27400;
  --accent: #e2641a;
  --good: #1f7a3a;
  --bad: #b3261e;
  --hp-track: #e9cfae;
  --hp-fill-a: #48b85c;
  --hp-fill-b: #2d8a44;
  --shadow: 0 6px 18px rgba(90, 40, 0, 0.18);
  --glow: rgba(240, 122, 18, 0.55);
  --scrim: rgba(60, 30, 10, 0.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1130;
    --text: #fff4e2;
    --muted: #e6d3bb;
    --panel: rgba(34, 20, 54, 0.9);
    --panel-2: rgba(48, 28, 74, 0.95);
    --panel-line: rgba(255, 200, 120, 0.3);
    --gold: #ffc85a;
    --gold-hi: #ffdd8f;
    --accent: #ff9a3c;
    --good: #7be08f;
    --bad: #ff7b6e;
    --hp-track: #3a2650;
    --hp-fill-a: #5fd474;
    --hp-fill-b: #2f9e4a;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    --glow: rgba(255, 154, 60, 0.6);
    --scrim: rgba(8, 4, 16, 0.6);
  }
}
:root[data-theme="dark"] {
  --bg: #1d1130; --text: #fff4e2; --muted: #e6d3bb; --panel: rgba(34, 20, 54, 0.9);
  --panel-2: rgba(48, 28, 74, 0.95); --panel-line: rgba(255, 200, 120, 0.3); --gold: #ffc85a;
  --gold-hi: #ffdd8f; --accent: #ff9a3c; --good: #7be08f; --bad: #ff7b6e; --hp-track: #3a2650;
  --hp-fill-a: #5fd474; --hp-fill-b: #2f9e4a; --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  --glow: rgba(255, 154, 60, 0.6); --scrim: rgba(8, 4, 16, 0.6);
}

/* ===================== BASE ===================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 17px; line-height: 1.3;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui {
  position: fixed; inset: 0; pointer-events: none;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
           max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  display: flex; justify-content: center;
}
.screen {
  position: relative; width: 100%; max-width: 520px; height: 100%;
  display: none; flex-direction: column; gap: 8px;
}
.screen.on { display: flex; }
button { font-family: inherit; }
img { -webkit-user-drag: none; }
.hidden { display: none !important; }
.clickable, button, .chip, .foe-preview { pointer-events: auto; cursor: pointer; }

/* ===================== BUTTONS ===================== */
.btn {
  min-height: 52px; min-width: 52px; padding: 0 18px; border: 0; border-radius: 16px;
  font-size: 18px; font-weight: 800; letter-spacing: 0.2px; color: #3a2208;
  background: linear-gradient(180deg, #fff3d8, #f0cf93);
  box-shadow: 0 4px 0 #a8661c, var(--shadow);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.08s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8661c, var(--shadow); }
.btn.primary { background: linear-gradient(180deg, #ffc061, #f2841c); color: #2a1100; box-shadow: 0 4px 0 #9c4708, var(--shadow); }
.btn.primary:active { box-shadow: 0 1px 0 #9c4708, var(--shadow); }
.btn.danger { background: linear-gradient(180deg, #ffd0c4, #f2937e); color: #3d0c04; box-shadow: 0 4px 0 #a8432e, var(--shadow); }
.btn.good { background: linear-gradient(180deg, #d9f7c8, #8fd677); color: #10320a; box-shadow: 0 4px 0 #4f8f3a, var(--shadow); }
.btn.big { min-height: 60px; font-size: 21px; padding: 0 28px; }
.btn[disabled] { filter: grayscale(0.7) brightness(0.9); opacity: 0.55; pointer-events: none; }
.btn .coin { width: 22px; height: 22px; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--panel-line);
  background: var(--panel); color: var(--text); font-size: 22px; font-weight: 900;
  display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
}
.icon-btn svg { width: 24px; height: 24px; }

/* ===================== TOP BAR / SHOP ===================== */
.topbar { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 48px;
  border-radius: 14px; background: var(--panel); border: 1px solid var(--panel-line);
  box-shadow: var(--shadow); font-weight: 800; font-size: 20px;
}
.pill img { width: 26px; height: 26px; }
.gold-pill { color: var(--gold); }
.gold-pill.bump { animation: bump 0.35s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.progress { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; min-height: 48px; justify-content: center; }
.progress .row { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
.progress .lbl { font-size: 16px; font-weight: 800; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.pill img.pip, .pip { width: 17px; height: 17px; flex: 0 0 auto; }
.foe-preview {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 52px;
  border-radius: 16px; background: var(--panel); border: 1px solid var(--panel-line);
  box-shadow: var(--shadow); text-align: left; color: var(--text); font-size: 17px;
}
.foe-preview img { width: 40px; height: 40px; }
.foe-preview .nm { font-weight: 900; font-size: 18px; }
.foe-preview .sub { color: var(--muted); font-weight: 700; font-size: 16px; }
.foe-preview .go { margin-left: auto; font-weight: 800; color: var(--accent); font-size: 16px; white-space: nowrap; }
.section-label {
  white-space: nowrap; display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px;
  font-weight: 900; font-size: 17px; color: var(--text); text-shadow: 0 1px 0 rgba(0,0,0,0.08);
}
.section-label .hint { font-weight: 700; color: var(--muted); font-size: 16px; }
.slot { position: relative; flex: 0 0 auto; }
.slot.grow { flex: 1 1 auto; min-height: 120px; }
#slot-offers { height: 170px; }
.actionbar { display: flex; gap: 10px; pointer-events: auto; padding-top: 2px; }
.actionbar .btn { flex: 1; }
.actionbar .btn.primary { flex: 1.5; }

/* selected-card panel */
.sel-panel {
  position: absolute; left: 0; right: 0; bottom: 64px; z-index: 3;
  background: var(--panel-2); border: 1px solid var(--panel-line); border-radius: 20px;
  padding: 14px 14px 12px; box-shadow: var(--shadow); pointer-events: auto;
  animation: rise 0.25s cubic-bezier(.2,1.4,.4,1);
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sel-panel h3 { margin: 0 0 4px; font-size: 22px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sel-panel p { margin: 6px 0 10px; font-size: 17px; color: var(--text); }
.tagchip { font-size: 16px; font-weight: 800; padding: 2px 10px; border-radius: 99px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.5); }
.stars { color: var(--gold); font-size: 18px; letter-spacing: 1px; }
.sel-actions { display: flex; gap: 10px; }
.sel-actions .btn { flex: 1; }
.sel-msg { font-size: 16px; font-weight: 700; color: var(--bad); min-height: 0; margin: 0 0 8px; }
.screen.dimmed .dim-me { opacity: 0.25; transition: opacity 0.2s; }
.dim-me { transition: opacity 0.2s; }

/* ===================== BATTLE ===================== */
.side-hud { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
.medal-slot { width: 68px; height: 68px; flex: 0 0 68px; }
.side-info {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 8px 12px; border-radius: 18px;
  background: var(--panel); border: 2px solid var(--panel-line); box-shadow: var(--shadow);
  transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer;
}
.side-hud.active .side-info { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow), var(--shadow); }
.side-name { display: flex; align-items: baseline; gap: 8px; font-weight: 900; font-size: 18px; white-space: nowrap; overflow: hidden; }
.side-name .arch { font-weight: 700; font-size: 16px; color: var(--muted); }
.hpbar {
  position: relative; height: 30px; border-radius: 10px; background: var(--hp-track); overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); border: 2px solid rgba(0,0,0,0.25);
}
.hpbar.shielded { border-color: #3b82d6; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 0 2px rgba(59,130,214,0.45); }
.hp-ghost, .hp-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; }
.hp-ghost { background: #fff1c9; transition: width 0.45s ease 0.25s; }
.hp-fill { background: linear-gradient(180deg, var(--hp-fill-a), var(--hp-fill-b)); transition: width 0.16s ease-out; }
.hp-fill.low { background: linear-gradient(180deg, #ff8a6a, #d23a26); }
.hp-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 19px; color: #fff; letter-spacing: 0.5px;
  text-shadow: 0 0 3px #000, 0 1px 2px #000, 0 0 1px #000;
}
.statuses { display: flex; gap: 6px; min-height: 32px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 3px; height: 32px; padding: 0 8px 0 4px;
  border-radius: 10px; background: rgba(0,0,0,0.08); border: 2px solid currentColor;
  font-weight: 900; font-size: 18px; min-width: 48px; position: relative;
}
.chip::before { content: ""; position: absolute; inset: -8px -2px; } /* bigger tap target */
.chip img { width: 26px; height: 26px; }
.chip.pop { animation: bump 0.3s cubic-bezier(.3,1.8,.5,1); }
.chip.shield { color: #2f6fc0; } .chip.burn { color: #d0640a; } .chip.poison { color: #3f8a14; } .chip.freeze { color: #1690b3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip.shield { color: #8cc0ff; }
  :root:not([data-theme="light"]) .chip.burn { color: #ffae5c; }
  :root:not([data-theme="light"]) .chip.poison { color: #a6e36a; }
  :root:not([data-theme="light"]) .chip.freeze { color: #7fe3ff; }
  :root:not([data-theme="light"]) .chip { background: rgba(255,255,255,0.06); }
}
:root[data-theme="dark"] .chip.shield { color: #8cc0ff; } :root[data-theme="dark"] .chip.burn { color: #ffae5c; }
:root[data-theme="dark"] .chip.poison { color: #a6e36a; } :root[data-theme="dark"] .chip.freeze { color: #7fe3ff; }
.chip span { color: var(--text); }
#slot-stage { position: relative; }
#caption {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  max-width: calc(100% - 150px); min-height: 0; text-align: center; padding: 8px 14px; border-radius: 14px;
  background: var(--panel-2); border: 1px solid var(--panel-line); box-shadow: var(--shadow);
  font-weight: 800; font-size: 17px; line-height: 1.25; opacity: 0; transition: opacity 0.15s;
}
#caption.on { opacity: 1; }
#caption img.ci { width: 24px; height: 24px; vertical-align: -6px; }
#caption .who { display: block; font-size: 16px; font-weight: 700; color: var(--muted); }
.speedbar { display: flex; gap: 10px; pointer-events: auto; }
.speedbar .btn { flex: 1; }
.speedbar .btn[aria-pressed="true"] { background: linear-gradient(180deg, #ffc061, #f2841c); color: #2a1100; box-shadow: 0 4px 0 #9c4708, var(--shadow); }

/* ===================== FX LAYERS ===================== */
#labels, #fx { position: fixed; inset: 0; pointer-events: none; }
#labels { transition: opacity 0.2s; }
body.focus #labels { opacity: 0; }
.tag-label {
  position: absolute; transform: translate(-50%, 0); padding: 2px 10px; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--panel-line); font-weight: 900; font-size: 17px;
  display: inline-flex; align-items: center; gap: 4px; color: var(--gold); white-space: nowrap; box-shadow: var(--shadow);
  transition: opacity 0.2s;
}
.tag-label img { width: 18px; height: 18px; }
.tag-label.cant { color: var(--bad); }
.pile-label { color: var(--text); font-size: 16px; font-weight: 800; }
.merge-badge {
  position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%;
  background: #2f9e4a; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center;
  border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); animation: bob 1.2s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translate(-50%, -62%); } }
.floater {
  position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 34px; white-space: nowrap;
  display: flex; align-items: center; gap: 4px; color: #fff; will-change: transform, opacity;
  text-shadow: 0 0 4px #000, 0 2px 0 #000, 0 0 2px #000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
}
.floater img { width: 30px; height: 30px; filter: drop-shadow(0 0 2px #000); }
.floater.dmg { color: #ff5a45; } .floater.heal { color: #7dff9a; } .floater.shield { color: #8ec5ff; }
.floater.burn { color: #ffb050; } .floater.poison { color: #b8f075; } .floater.freeze { color: #9eeaff; }
.floater.blocked { color: #b9d7ff; font-size: 26px; } .floater.small { font-size: 24px; }
.banner {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  font-weight: 1000; font-size: 44px; letter-spacing: 1px; white-space: nowrap; text-align: center;
  color: #fff; display: flex; align-items: center; gap: 10px;
  text-shadow: 0 0 6px #000, 0 3px 0 #000, 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
}
.banner img { width: 52px; height: 52px; filter: drop-shadow(0 0 3px #000); }
.banner small { display: block; font-size: 20px; font-weight: 800; }

/* ===================== MODALS ===================== */
.modal {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim); pointer-events: auto;
  display: flex; align-items: flex-end; justify-content: center;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  animation: fade 0.18s ease;
}
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 520px; max-height: 100%; overflow: auto; -webkit-overflow-scrolling: touch;
  touch-action: pan-y; background: var(--panel-2); border: 1px solid var(--panel-line); border-radius: 22px;
  padding: 18px 16px 14px; box-shadow: var(--shadow); animation: rise 0.28s cubic-bezier(.2,1.3,.4,1);
  -webkit-user-select: text; user-select: text;
}
.sheet h2 { margin: 0 0 8px; font-size: 26px; }
.sheet h4 { margin: 14px 0 6px; font-size: 19px; color: var(--accent); }
.sheet p, .sheet li { font-size: 17px; margin: 4px 0; }
.sheet ul { margin: 0; padding-left: 0; list-style: none; }
.sheet li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
.sheet li img { width: 30px; height: 30px; flex: 0 0 30px; }
.sheet .close-row { display: flex; gap: 10px; margin-top: 14px; position: sticky; bottom: -14px; padding: 10px 0 2px; background: var(--panel-2); }
.sheet .close-row .btn { flex: 1; }
.inspect { display: flex; gap: 14px; align-items: flex-start; }
.inspect canvas, .inspect img.face { width: 46%; max-width: 230px; border-radius: 12px; box-shadow: var(--shadow); flex: 0 0 auto; }
.inspect .txt { flex: 1; min-width: 0; }
.deck-list .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--panel-line); }
.deck-list .row img { width: 36px; height: 36px; flex: 0 0 36px; }
.deck-list .row b { font-size: 17px; }
.deck-list .row .ln { color: var(--muted); font-size: 16px; }
.center-sheet { align-self: center; text-align: center; }
.big-title { font-size: 40px; font-weight: 1000; margin: 4px 0; }

/* ===================== TITLE ===================== */
#scr-title { justify-content: space-between; align-items: center; text-align: center; padding: 6vh 0 4vh; }
.logo { pointer-events: none; }
.logo h1 {
  margin: 0; font-size: clamp(48px, 15vw, 76px); font-weight: 1000; line-height: 0.95; letter-spacing: -1px;
  color: #ffd98a; -webkit-text-stroke: 2px #4a1d05;
  text-shadow: 0 4px 0 #8a3a00, 0 10px 24px rgba(0,0,0,0.45);
}
.logo h1 .amp { color: #c79bff; }
.logo p { margin: 10px 0 0; font-size: 18px; font-weight: 800; color: var(--text); }
.title-btns { display: flex; flex-direction: column; gap: 12px; width: min(100%, 340px); pointer-events: auto; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Game board"></canvas>
<div id="ui">
  <!-- ============ TITLE ============ -->
  <section id="scr-title" class="screen">
    <div class="logo"><h1>Ember<br><span class="amp">&amp;</span> Hex</h1><p>A tiny autobattler deckbuilder</p></div>
    <div class="title-btns">
      <button class="btn big primary" id="btn-new">New Run</button>
      <button class="btn big hidden" id="btn-continue">Continue Run</button>
      <button class="btn" id="btn-guide-title">How to Play</button>
    </div>
  </section>

  <!-- ============ SHOP ============ -->
  <section id="scr-shop" class="screen">
    <div class="topbar dim-me">
      <div class="pill gold-pill" id="gold-pill" aria-label="Gold"><img data-icon="gold" alt=""><span id="gold">0</span></div>
      <div class="pill progress" aria-label="Run progress">
        <div class="row"><span class="lbl">Wins</span><span id="win-pips" class="row"></span></div>
        <div class="row"><span class="lbl">Lives</span><span id="life-pips" class="row"></span></div>
      </div>
      <button class="icon-btn" id="btn-mute" aria-label="Toggle sound"></button>
      <button class="icon-btn" id="btn-help" aria-label="How to play">?</button>
    </div>
    <button class="foe-preview dim-me" id="foe-preview"></button>
    <div class="section-label dim-me"><span>Round <span id="round-no">1</span> shop</span><span class="hint">Tap a card</span></div>
    <div id="slot-offers" class="slot"></div>
    <div class="section-label dim-me"><span>Your deck <span id="deck-count"></span></span><span class="hint" id="deck-hint">8–15 cards</span></div>
    <div id="slot-deck" class="slot grow"></div>
    <div id="sel-panel" class="sel-panel hidden"></div>
    <div class="actionbar">
      <button class="btn" id="btn-reroll">Reroll <img class="coin" data-icon="gold" alt="">1</button>
      <button class="btn primary" id="btn-fight">Fight! ⚔</button>
    </div>
  </section>

  <!-- ============ BATTLE ============ -->
  <section id="scr-battle" class="screen">
    <div class="side-hud" id="hud-B">
      <div class="medal-slot"></div>
      <div class="side-info">
        <div class="side-name"><span class="nm"></span><span class="arch"></span></div>
        <div class="hpbar"><div class="hp-ghost"></div><div class="hp-fill"></div><div class="hp-text"></div></div>
        <div class="statuses"></div>
      </div>
    </div>
    <div id="slot-stage" class="slot grow"><div id="caption"></div></div>
    <div class="side-hud" id="hud-A">
      <div class="medal-slot"></div>
      <div class="side-info">
        <div class="side-name"><span class="nm"></span><span class="arch"></span></div>
        <div class="hpbar"><div class="hp-ghost"></div><div class="hp-fill"></div><div class="hp-text"></div></div>
        <div class="statuses"></div>
      </div>
    </div>
    <div class="speedbar">
      <button class="btn" id="spd-1" aria-pressed="true">1×</button>
      <button class="btn" id="spd-2" aria-pressed="false">2×</button>
      <button class="btn" id="spd-skip">Skip ⏭</button>
    </div>
  </section>
</div>
<div id="labels"></div>
<div id="fx"></div>
<div id="modal-root"></div>
<script>
/* =====================================================================
   EMBER & HEX — pure game logic (no DOM, no three.js)
   ---------------------------------------------------------------------
   This classic script defines globals used by the renderer:
     TAGS, CARDS, CURSE_IDS, ARCHETYPES, makeRng, simulate(), ...
   simulate(deckA, deckB, seed) is a pure, deterministic function that
   returns { events, winner }. Decks are plain serializable JSON:
     { name, hp, glyph?, cards: [ { id, lvl, bonus } ] }
   ===================================================================== */
'use strict';

/* ---------- Seeded RNG (mulberry32) ---------- */
function makeRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  const r = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = (n) => Math.floor(r() * n);
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  r.weighted = (items, wfn) => {
    let tot = 0;
    for (const it of items) tot += Math.max(0, wfn(it));
    let x = r() * tot;
    for (const it of items) { x -= Math.max(0, wfn(it)); if (x <= 0) return it; }
    return items[items.length - 1];
  };
  return r;
}

    desc: (v, s, lvl) => `Create a random card of your deck's most common type at level ${lvl} and cast it right now.`,
    play: (c) => c.conjure() },
  { id: 'echo', name: 'Echo', tag: 'discover', tier: 2, glyph: 'echo',
    num: { k: 'create', v: [1, 2, 3] },
    line: (v) => `Shuffle ${v} copies of your last card.`,
    desc: (v) => `Shuffle ${v} copies of the last card you played into your deck for this fight.`,
    play: (c) => c.echo(c.v) },

  /* ---------------- CURSE TOKENS (not sold in the shop) ---------------- */
  { id: 'junk', name: 'Junk', tag: 'token', tier: 0, glyph: 'junk', token: true,
    num: { k: 'curse', v: ['—', '—', '—'] },
    line: () => `Does nothing.`,
    desc: () => `A curse. Does nothing — it just wastes a turn.`,
    play: () => {} },
  { id: 'hex', name: 'Hex', tag: 'token', tier: 0, glyph: 'pentagram', token: true,
    num: { k: 'dmg', v: [3, 3, 3] },
    line: () => `Drawn: you take 3 damage.`,
    desc: () => `A curse. When drawn, its owner takes 3 damage (Shield blocks it).`,
    onDraw: (c) => c.dmg(c.me, 3, { kind: 'hex', self: true }),
    play: () => {} },
  { id: 'rot', name: 'Rot', tag: 'token', tier: 0, glyph: 'mushroom', token: true,
    num: { k: 'freeze', v: [1, 1, 1] },
    line: () => `Drawn: your next card is Frozen.`,
    desc: () => `A curse. When drawn, its owner's next card is Frozen and fizzles.`,
    onDraw: (c) => { c.me.rotPending += 1; },
    play: () => {} },
];

const CARDS = {};
for (const d of CARD_LIST) CARDS[d.id] = d;
const CURSE_IDS = ['junk', 'hex', 'rot'];
const SHOP_IDS = CARD_LIST.filter((d) => !d.token).map((d) => d.id);
const cardCost = (id) => CARDS[id].tier + 2;
const sellValue = (card) => card.lvl * 2 - 1 + (card.bonus > 0 ? 1 : 0);

/* Numbers shown on a card for a given level/bonus (used by sim + renderer). */
function cardNums(card, extra) {
  const d = CARDS[card.id];
  const i = Math.max(0, Math.min(2, (card.lvl || 1) - 1));
  let v = d.num.v[i];
  const add = (card.bonus || 0) + (card.fb || 0) + (extra || 0);
  if (typeof v === 'number') v = Math.max(0, v + add);
  else if (v === 'X' && add) v = 'X+' + add;
  const s = d.sub ? d.sub.v[i] : null;
  return { v, s };
}
function cardLine(card) {
  const { v, s } = cardNums(card);
  return CARDS[card.id].line(v, s, card.lvl);
}
function cardDesc(card) {
  const { v, s } = cardNums(card);
  return CARDS[card.id].desc(v, s, card.lvl);
}

/* ======================================================================
   OPPONENT ARCHETYPES (procedural decks scale with the round)
   ====================================================================== */
const ARCHETYPES = {
  aggro:  { name: 'Goblin Raiders', style: 'Aggro',         glyph: 'horns',     color: '#d9452f',
            core: ['strike', 'twin', 'reckless', 'heavy', 'execute', 'rampage', 'coin', 'bite'] },
  poison: { name: 'Plague Rats',    style: 'Poison',        glyph: 'droplet',   color: '#62b02a',
            core: ['dart', 'venom', 'cloud', 'catalyst', 'guard', 'bite', 'venom', 'dart'] },
  frost:  { name: 'Rime Coven',     style: 'Burn & Freeze', glyph: 'frostfire', color: '#2fb6d8',
            core: ['spark', 'fireball', 'iceshard', 'coldsnap', 'frostbolt', 'frostfire', 'stoke', 'inferno', 'flameward'] },
  curse:  { name: 'Hexweaver',      style: 'Curses',        glyph: 'pentagram', color: '#8a4fd6',
            core: ['litter', 'hexbolt', 'rotgift', 'gloat', 'polymorph', 'pact', 'strike', 'hexbolt'] },
  junk:   { name: 'Scrap King',     style: 'Junk',          glyph: 'golem',     color: '#8d7b62',
            core: ['litter', 'golem', 'hoard', 'grudge', 'pact', 'bash', 'litter', 'scout'] },
  wall:   { name: 'Iron Abbot',     style: 'Shield & Heal', glyph: 'castle',    color: '#3b82d6',
            core: ['guard', 'bulwark', 'spiked', 'bash', 'mend', 'wind', 'fortify', 'cleanse'] },
};
const ARCH_KEYS = Object.keys(ARCHETYPES);

const PLAYER_HP = 40;
function opponentHp(round) { return 26 + round * 3; }

/* Build an opponent deck for a round (1-based). Pure & seeded. */
function makeOpponent(round, seed) {
  const rng = makeRng(seed ^ (round * 7919));
  const key = ARCH_KEYS[(rng.int(ARCH_KEYS.length) + round) % ARCH_KEYS.length];
  const A = ARCHETYPES[key];
  const maxTier = round <= 2 ? 1 : round <= 4 ? 2 : 3;
  const n = Math.min(14, 8 + Math.floor(round / 2));
  const pool = A.core.filter((id) => CARDS[id].tier <= maxTier);
  const basics = ['strike', 'guard', 'strike', 'mend'];
  const cards = [];
  const nCore = Math.max(3, Math.round(n * (0.45 + round * 0.05)));
  for (let i = 0; i < n; i++) {
    const id = i < nCore && pool.length ? rng.pick(pool) : rng.pick(basics);
    let lvl = 1;
    if (rng() < (round - 4) * 0.09) lvl++;
    if (lvl === 2 && rng() < (round - 6) * 0.1) lvl++;
    cards.push({ id, lvl, bonus: 0 });
  }
  return { name: A.name, arch: key, glyph: A.glyph, hp: opponentHp(round), cards };
}

function starterDeck() {
  const ids = ['strike', 'strike', 'strike', 'strike', 'guard', 'guard', 'guard', 'mend', 'mend', 'spark'];
  return { name: 'You', glyph: 'hero', hp: PLAYER_HP, cards: ids.map((id) => ({ id, lvl: 1, bonus: 0 })) };
}

/* ======================================================================
   SIMULATION — simulate(deckA, deckB, seed) -> { events, winner, buffs }
   Every event carries `s`: a snapshot of both sides AFTER the event, so the
   renderer can simply animate and then sync the HUD.
   ====================================================================== */
const MAX_TURNS = 300;
const MAX_FREEZE = 2;
function fatigueDamage(n) { return 5 * Math.pow(3, n - 1); } // 5, 15, 45...

function simulate(deckA, deckB, seed) {
  const rng = makeRng(seed);
  const events = [];
  const buffs = []; // permanent buffs (Lucky Charm) for side A/B source cards
  let uid = 1;
  const mkSide = (deck, key) => ({
    key, name: deck.name, hp: deck.hp, max: deck.hp,
    shield: 0, burn: 0, poison: 0, frozen: 0, rotPending: 0,
    fatigue: 0, chain: 0, tempAll: 0, lastPlayed: null,
    draw: rng.shuffle(deck.cards.map((c, i) => ({ uid: uid++, id: c.id, lvl: c.lvl || 1, bonus: c.bonus || 0, fb: 0, src: i }))),
    discard: [],
  });
  const S = { A: mkSide(deckA, 'A'), B: mkSide(deckB, 'B') };
  const other = (side) => (side.key === 'A' ? S.B : S.A);
  const snapSide = (x) => ({ hp: x.hp, max: x.max, sh: x.shield, burn: x.burn, poison: x.poison,
    frozen: x.frozen + x.rotPending, deck: x.draw.length, disc: x.discard.length, chain: x.chain });
  const snap = () => ({ A: snapSide(S.A), B: snapSide(S.B) });
  const pub = (card) => card && ({ uid: card.uid, id: card.id, lvl: card.lvl, bonus: card.bonus + card.fb });
  const emit = (e) => { e.s = snap(); events.push(e); return e; };
  let over = false;
  let current = null; // side whose card is resolving
  const isCurse = (c) => CURSE_IDS.includes(c.id);
  const allCards = (x) => x.draw.concat(x.discard, x.inPlay ? [x.inPlay] : []);

  /* ---- primitive effects ---- */
  function dmg(target, n, opts = {}) {
    n = Math.max(0, Math.round(n));
    if (over || n <= 0) return 0;
    const blocked = opts.pierce ? 0 : Math.min(target.shield, n);
    target.shield -= blocked;
    const dealt = n - blocked;
    target.hp -= dealt;
    const lethal = target.hp <= 0;
    emit({ t: 'dmg', side: target.key, amount: dealt, blocked, kind: opts.kind || 'hit', lethal,
           self: !!opts.self, chain: current ? current.chain : 0 });
    if (lethal) over = true;
    return dealt;
  }
  function shield(side, n) {
    n = Math.max(0, Math.round(n)); if (over || n <= 0) return;
    side.shield += n; emit({ t: 'shield', side: side.key, amount: n });
  }
  function heal(side, n) {
    if (over) return;
    const h = Math.max(0, Math.min(Math.round(n), side.max - side.hp));
    side.hp += h; emit({ t: 'heal', side: side.key, amount: h });
  }
  function status(target, st, n) {
    if (over || n <= 0) return;
    if (st === 'burn') {
      target.burn += n; emit({ t: 'status', side: target.key, status: 'burn', amount: n });
      if (target.frozen > 0) shatter(target);
    } else if (st === 'poison') {
      target.poison += n; emit({ t: 'status', side: target.key, status: 'poison', amount: n });
    } else if (st === 'freeze') {
      const before = target.frozen;
      target.frozen = Math.min(MAX_FREEZE, target.frozen + n);
      emit({ t: 'status', side: target.key, status: 'freeze', amount: target.frozen - before });
      if (target.burn > 0) shatter(target);
      if (!over && target.poison > 0) frostbite(target);
    }
  }
  /* ---- STATUS COMBOS ---- */
  function shatter(t) { // Freeze + Burn
    const n = t.burn * 2 + 3; t.burn = 0;
    emit({ t: 'combo', combo: 'shatter', side: t.key, amount: n });
    dmg(t, n, { kind: 'shatter', pierce: true });
  }
  function frostbite(t) { // Freeze + Poison
    emit({ t: 'combo', combo: 'frostbite', side: t.key, amount: t.poison });
    dmg(t, t.poison, { kind: 'frostbite', pierce: true });
  }
  function plague(t) { // Curse drawn while Poisoned
    t.poison += 2;
    emit({ t: 'combo', combo: 'plague', side: t.key, amount: 2 });
  }
  function shuffleIn(side, cards) {
    for (const c of cards) side.draw.splice(rng.int(side.draw.length + 1), 0, c);
  }
  function curse(target, id, n) {
    if (over || n <= 0) return;
    const cards = [];
    for (let i = 0; i < n; i++) cards.push({ uid: uid++, id, lvl: 1, bonus: 0, fb: 0, src: -1 });
    shuffleIn(target, cards);
    emit({ t: 'curse', side: target.key, id, n, from: current ? current.key : target.key });
  }
  const tagCounts = (side) => {
    const counts = {};
    for (const c of allCards(side)) {
      const tg = CARDS[c.id].tag;
      if (tg === 'token' || tg === 'discover') continue;
      counts[tg] = (counts[tg] || 0) + 1;
    }
    return counts;
  };
  function discoverPick(side) {
    const counts = tagCounts(side);
    let top = 'attack', best = -1;
    for (const k in counts) if (counts[k] > best) { best = counts[k]; top = k; }
    const pool = SHOP_IDS.filter((id) => CARDS[id].tag !== 'discover');
    return rng.weighted(pool, (id) => {
      const tg = CARDS[id].tag;
      return 1 + (tg === top ? 8 : 0) + (counts[tg] || 0);
    });
  }
  function create(side, n, lvl) {
    if (over) return;
    const cards = [];
    for (let i = 0; i < n; i++) cards.push({ uid: uid++, id: discoverPick(side), lvl, bonus: 0, fb: 0, src: -1 });
    shuffleIn(side, cards);
    emit({ t: 'create', side: side.key, cards: cards.map(pub) });
  }
  /* Run another card's play effect from inside a card (Wild Magic, Mirror, Conjure). */
  function castAs(side, card, viaId) {
    emit({ t: 'morph', side: side.key, card: pub(card), via: viaId });
    runPlay(side, card);
  }
  function makeCtx(me, card) {
    const foe = other(me);
    const d = CARDS[card.id];
    const nums = cardNums(card, me.tempAll);
    const c = {
      me, foe, card, rng, lvl: card.lvl, v: nums.v, s: nums.s,
      dmg, shield, heal, status, curse, create,
      deckSize: (x) => allCards(x).length,
      cursesIn: (arr) => arr.filter(isCurse).length,
      cursesOf: (x) => allCards(x).filter(isCurse).length,
      cleanse: (x) => { x.burn = 0; x.poison = 0; emit({ t: 'cleanse', side: x.key }); },
      polymorph: (x, n) => {
        const cands = x.draw.filter((k) => !isCurse(k));
        rng.shuffle(cands);
        const hit = cands.slice(0, n);
        for (const k of hit) { k.id = 'junk'; k.lvl = 1; k.bonus = 0; k.fb = 0; k.src = -1; }
        emit({ t: 'curse', side: x.key, id: 'junk', n: hit.length, from: me.key, poly: true });
      },
      luckyBuff: (n) => {
        const cands = allCards(me).filter((k) => k !== card && !CARDS[k.id].token && typeof CARDS[k.id].num.v[0] === 'number');
        if (!cands.length) return;
        const k = rng.pick(cands);
        k.bonus += n;
        if (k.src >= 0) buffs.push({ side: me.key, index: k.src, amount: n });
        emit({ t: 'buff', side: me.key, target: pub(k), amount: n, permanent: k.src >= 0 });
      },
      overcharge: (n) => { me.tempAll += n; emit({ t: 'buff', side: me.key, all: true, amount: n }); },
      castRandom: () => {
        const pool = SHOP_IDS.filter((id) => !['wild', 'mirror', 'conjure', 'lucky', 'overcharge'].includes(id));
        castAs(me, { uid: uid++, id: rng.pick(pool), lvl: card.lvl, bonus: 0, fb: 0, src: -1 }, 'wild');
      },
      conjure: () => castAs(me, { uid: uid++, id: discoverPick(me), lvl: card.lvl, bonus: 0, fb: 0, src: -1 }, 'conjure'),
      mirror: () => {
        const last = foe.lastPlayed;
        if (!last || ['mirror', 'lucky', 'overcharge'].includes(last.id) || CARDS[last.id].token) {
          emit({ t: 'note', side: me.key, text: 'Nothing to copy' }); return;
        }
        castAs(me, { uid: uid++, id: last.id, lvl: card.lvl, bonus: 0, fb: 0, src: -1 }, 'mirror');
      },
      coinFlip: (n) => {
        const heads = rng() < 0.5;
        emit({ t: 'coin', side: me.key, heads });
        if (heads) dmg(foe, n);
      },
      echo: (n) => {
        const last = me.lastPlayed;
        if (!last || last.id === 'echo') { emit({ t: 'note', side: me.key, text: 'Nothing to echo' }); return; }
        const cards = [];
        for (let i = 0; i < n; i++) cards.push({ uid: uid++, id: last.id, lvl: last.lvl, bonus: last.bonus, fb: 0, src: -1 });
        shuffleIn(me, cards);
        emit({ t: 'create', side: me.key, cards: cards.map(pub) });
      },
    };
    if (d.xval) c.x = d.xval(c) + (card.bonus || 0) + (card.fb || 0) + me.tempAll;
    return c;
  }
  function runPlay(me, card) { CARDS[card.id].play(makeCtx(me, card)); }

  /* ---- main loop ---- */
  const first = rng() < 0.5 ? S.A : S.B;
  emit({ t: 'start', first: first.key });
  let me = first;
  let turn = 0;
  for (; turn < MAX_TURNS && !over; turn++) {
    const foe = other(me);
    current = me;
    emit({ t: 'turn', side: me.key, n: turn });
    // 0) Shield decays: half of it fades at the start of your turn
    if (me.shield > 0) {
      const lost = Math.ceil(me.shield / 2);
      me.shield -= lost;
      emit({ t: 'decay', side: me.key, amount: lost });
    }
    // 1) status ticks
    if (me.burn > 0) {
      emit({ t: 'tick', side: me.key, status: 'burn' });
      dmg(me, me.burn, { kind: 'burn' });
      me.burn = Math.max(0, me.burn - 1);
      if (over) break;
    }
    if (me.poison > 0) {
      emit({ t: 'tick', side: me.key, status: 'poison' });
      dmg(me, me.poison, { kind: 'poison', pierce: true });
      if (over) break;
    }
    // 2) draw (reshuffle + escalating fatigue when the deck runs out)
    if (me.draw.length === 0) {
      me.draw = rng.shuffle(me.discard); me.discard = [];
      me.fatigue++;
      emit({ t: 'reshuffle', side: me.key, n: me.fatigue });
      dmg(me, fatigueDamage(me.fatigue), { kind: 'fatigue', pierce: true });
      if (over) break;
    }
    const card = me.draw.pop();
    if (!card) { me = foe; continue; }
    me.inPlay = card;
    emit({ t: 'draw', side: me.key, card: pub(card) });
    // 3) on-draw triggers
    const d = CARDS[card.id];
    if (d.onDraw) {
      emit({ t: 'trigger', side: me.key, card: pub(card) });
      d.onDraw(makeCtx(me, card));
      if (over) break;
    }
    if (isCurse(card) && me.poison > 0) plague(me);
    // 4) play or fizzle
    if (me.frozen > 0) {
      me.frozen--; me.chain = 0;
      emit({ t: 'fizzle', side: me.key, card: pub(card) });
    } else {
      const useful = !d.token;
      me.chain = useful ? me.chain + 1 : 0;
      emit({ t: 'play', side: me.key, card: pub(card), chain: me.chain });
      runPlay(me, card);
      if (useful) me.lastPlayed = card;
    }
    if (me.rotPending) { me.frozen = Math.min(MAX_FREEZE, me.frozen + me.rotPending); me.rotPending = 0; }
    me.inPlay = null;
    me.discard.push(card);
    if (over) break;
    emit({ t: 'discard', side: me.key, card: pub(card) });
    me = foe;
  }
  let winner;
  if (S.A.hp <= 0 && S.B.hp > 0) winner = 'B';
  else if (S.B.hp <= 0 && S.A.hp > 0) winner = 'A';
  else winner = S.A.hp >= S.B.hp ? 'A' : 'B'; // timeout tiebreak
  emit({ t: 'end', winner });
  return { events, winner, buffs, turns: turn };
}

/* Expose for Node tests (ignored in the browser). */
if (typeof module !== 'undefined') {
  module.exports = { makeRng, CARDS, CARD_LIST, SHOP_IDS, ARCHETYPES, simulate, makeOpponent, starterDeck,
    cardCost, sellValue, cardNums, cardLine, cardDesc, opponentHp };
}

/* ---- badge icons (distinct SHAPE + color per status/kind) ---- */

function makeCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }

/* Draw a badge (shape) at x,y with radius r */
function drawBadge(c, shape, x, y, r, color, outline = '#2a1608') {
  c.save(); c.translate(x, y); c.scale(r, r); c.lineWidth = 0.12; c.lineJoin = 'round'; c.strokeStyle = outline;
  BADGE[shape](c, color); c.restore();
}

/* Big number text with heavy outline */
function drawNumber(c, text, x, y, px, fill = '#fff') {
  c.save(); c.font = `900 ${px}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const t = String(text);
  const w = c.measureText(t).width; const maxW = px * 1.6;
  if (w > maxW) { c.translate(x, y); c.scale(maxW / w, 1); c.translate(-x, -y); }
  c.lineJoin = 'round'; c.lineWidth = px * 0.16; c.strokeStyle = '#1f0e04'; c.strokeText(t, x, y + px * 0.04);
  c.fillStyle = fill; c.fillText(t, x, y + px * 0.04); c.restore();
}

/* Fit-and-wrap text into at most `maxLines` lines */
function wrapLines(c, text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f > 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/* ---------------------------------------------------------------------
   CARD FACE — variant 'full' (name + rules line) or 'compact' (icon+number)
   --------------------------------------------------------------------- */
function drawCardFace(card, variant) {
  const d = CARDS[card.id];
  const T = TAGS[d.tag];
  const full = variant === 'full';
  const W = full ? 512 : 256, H = Math.round(W * 1.4);
  const cv = makeCanvas(W, H); const c = cv.getContext('2d');
  const u = W / 512; // unit scale
  // frame
  rr(c, 0, 0, W, H, 44 * u);
  let g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, shade(T.color, 0.25)); g.addColorStop(1, T.dark);
  c.fillStyle = g; c.fill();
  // inner parchment
  const ins = 20 * u;
  rr(c, ins, ins, W - ins * 2, H - ins * 2, 30 * u);
  g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fff6e4'); g.addColorStop(1, '#f0d4a4');
  c.fillStyle = g; c.fill();
  c.lineWidth = 5 * u; c.strokeStyle = '#d9a441'; c.stroke();
  // art window
  const ax = 44 * u, aw = W - 88 * u;
  const ay = full ? 132 * u : 74 * u;
  const ah = full ? 300 * u : 386 * u;
  rr(c, ax, ay, aw, ah, 26 * u);
  g = c.createRadialGradient(W / 2, ay + ah * 0.45, 10 * u, W / 2, ay + ah * 0.45, aw * 0.75);
  g.addColorStop(0, shade(T.color, 0.55)); g.addColorStop(0.55, T.color); g.addColorStop(1, T.dark);
  c.fillStyle = g; c.fill();
  // sun rays inside window
  c.save(); rr(c, ax, ay, aw, ah, 26 * u); c.clip();
  c.globalAlpha = 0.14; c.fillStyle = '#fff';
  for (let i = 0; i < 12; i++) { const a = i * TAU / 12; c.beginPath(); c.moveTo(W / 2, ay + ah * 0.45);
    c.arc(W / 2, ay + ah * 0.45, aw, a, a + 0.13); c.closePath(); c.fill(); }
  c.restore();
  c.lineWidth = 6 * u; c.strokeStyle = T.dark; rr(c, ax, ay, aw, ah, 26 * u); c.stroke();
  // glyph
  const gs = full ? 118 * u : 132 * u;
  const gy = ay + ah * (full ? 0.43 : 0.4);
  c.save(); c.translate(W / 2, gy); c.scale(gs, gs);
  c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 18 * u; c.shadowOffsetY = 8 * u;
  c.lineWidth = 0.075; c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = '#2a1608';
  (GLYPH[d.glyph] || GLYPH.star)(c, { light: '#fff6e5', accent: T.color, dark: '#2a1608' });
  c.restore();
  // level stars
  const lvl = card.lvl || 1;
  if (full) for (let i = 0; i < lvl; i++) drawBadge(c, 'star', ax + 36 * u + i * 50 * u, ay + 36 * u, 24 * u, '#ffd34d');
  else for (let i = 0; i < lvl; i++) drawBadge(c, 'star', W / 2 + (i - (lvl - 1) / 2) * 60 * u, 48 * u, 27 * u, '#ffd34d');
  // name banner (full only)
  if (full) {
    const by = 34 * u, bh = 84 * u;
    rr(c, 36 * u, by, W - 72 * u, bh, 22 * u);
    g = c.createLinearGradient(0, by, 0, by + bh); g.addColorStop(0, shade(T.color, 0.15)); g.addColorStop(1, T.dark);
    c.fillStyle = g; c.fill(); c.lineWidth = 5 * u; c.strokeStyle = '#2a1608'; c.stroke();
    c.font = `900 ${54 * u}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const nw = c.measureText(d.name).width, maxW = W - 110 * u;
    c.save(); c.translate(W / 2, by + bh / 2 + 3 * u); if (nw > maxW) c.scale(maxW / nw, 1);
    c.lineJoin = 'round'; c.lineWidth = 10 * u; c.strokeStyle = '#1f0e04'; c.strokeText(d.name, 0, 0);
    c.fillStyle = '#fff'; c.fillText(d.name, 0, 0); c.restore();
  }
  // big number badge
  const { v, s } = cardNums(card);
  const K = KINDS[d.num.k];
  const nx = W / 2, ny = full ? ay + ah + 8 * u : ay + ah + 76 * u;
  const br = full ? 84 * u : 122 * u;
  drawBadge(c, K.shape, nx, ny, br, K.color);
  const vt = String(v);
  drawNumber(c, vt, nx, ny + (K.shape === 'heart' ? -6 * u : K.shape === 'droplet' ? 14 * u : 0), (vt.length > 2 ? 70 : full ? 104 : 150) * u,
    (card.bonus || 0) > 0 ? '#c8ffb0' : '#fff');
  // sub badge
  if (d.sub) {
    const SK = KINDS[d.sub.k];
    const sx = full ? W - 120 * u : W - 92 * u, syy = full ? ny + 4 * u : ny - 24 * u, sr2 = full ? 50 * u : 68 * u;
    drawBadge(c, SK.shape, sx, syy, sr2, SK.color);
    const st = String(s);
    drawNumber(c, st, sx, syy + (SK.shape === 'droplet' ? 8 * u : 0), (st.length > 2 ? 40 : 60) * (full ? 1 : 1.35) * u);
  }
  // rules line (full only)
  if (full) {
    const text = cardLine(card);
    c.fillStyle = '#2a1608'; c.textAlign = 'center'; c.textBaseline = 'middle';
    let px = 42 * u, lines;
    for (;;) { c.font = `800 ${px}px ${FONT}`; lines = wrapLines(c, text, W - 80 * u); if (lines.length <= 2 || px <= 36 * u) break; px -= 2 * u; }
    const top = ay + ah + 98 * u, lh = px * 1.15;
    const mid = top + (H - 30 * u - top) / 2;
    lines.slice(0, 2).forEach((ln, i) => c.fillText(ln, W / 2, mid + (i - (Math.min(2, lines.length) - 1) / 2) * lh));
  }
  return cv;
}

function drawCardBack() {

/* Edge texture is plain color; soft blob shadow texture */
function drawShadowTex() {
  const W = 128, H = 160; const cv = makeCanvas(W, H); const c = cv.getContext('2d');
  c.filter = 'blur(12px)'; c.fillStyle = 'rgba(0,0,0,0.85)'; rr(c, 26, 26, W - 52, H - 52, 14); c.fill();
  if (c.filter === 'none' || !('filter' in c)) { /* fallback: radial */ c.clearRect(0, 0, W, H);
    const g = c.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, 70); g.addColorStop(0, 'rgba(0,0,0,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }

/* Medallion portrait (top face of a coin) */
function drawMedallion(glyph, color) {
  const S = 256; const cv = makeCanvas(S, S); const c = cv.getContext('2d');
  let g = c.createRadialGradient(S / 2, S * 0.4, 10, S / 2, S / 2, S / 2);
  g.addColorStop(0, shade(color, 0.45)); g.addColorStop(1, shade(color, -0.45));
  circle(c, S / 2, S / 2, S / 2); c.fillStyle = '#e8b04a'; c.fill();
  circle(c, S / 2, S / 2, S / 2 - 14); c.fillStyle = g; c.fill();
  c.lineWidth = 6; c.strokeStyle = '#7a4a10'; c.stroke();
  c.save(); c.translate(S / 2, S / 2 + 4); c.scale(72, 72); c.lineWidth = 0.08; c.lineJoin = 'round'; c.strokeStyle = '#2a1608';
  c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 10; c.shadowOffsetY = 4;

/* Small HUD icons as data URLs */
const ICONS = {};
function makeIcons() {
  const defs = {
    burn: ['flame', '#f07a12'], poison: ['droplet', '#62b02a'], freeze: ['snowflake', '#2fb6d8'],
    shield: ['shield', '#3b82d6'], heal: ['heart', '#e0508f'], dmg: ['burst', '#d9452f'],
    hex: ['pentagram', '#8a4fd6'], rot: ['mushroom', '#8a7a2e'], junk: ['junk', '#888'],
    fatigue: ['hourglass', '#9a8f80'], gold: ['coin', '#ffc93a'], buff: ['diamond', '#d6a419'],
    create: ['sparkle', '#16a58c'], curse: ['pentagram', '#8a4fd6'],
    win: ['star', '#ffc93a'], winoff: ['star', 'rgba(190,160,130,0.5)'],
    life: ['lifeheart', '#e0508f'], lifeoff: ['lifeheart', 'rgba(190,160,130,0.5)'],

  for (const k in defs) {

}

/* Particle atlas: 4x2 cells of white shapes, tinted per particle */
function drawParticleAtlas() {
  const C = 64; const cv = makeCanvas(C * 4, C * 2); const c = cv.getContext('2d');
  const cell = (i, fn) => { c.save(); c.translate((i % 4) * C + C / 2, Math.floor(i / 4) * C + C / 2); fn(); c.restore(); };
  cell(0, () => { const g = c.createRadialGradient(0, 0, 0, 0, 0, 30); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.6)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(-32, -32, 64, 64); });
  cell(1, () => { c.scale(26, 26); c.shadowColor = '#fff'; c.shadowBlur = 10; PATH.flame(c); c.fillStyle = '#fff'; c.fill(); });
  cell(2, () => { circle(c, 0, 0, 22); c.lineWidth = 6; c.strokeStyle = '#fff'; c.stroke(); c.fillStyle = 'rgba(255,255,255,0.25)'; c.fill(); circle(c, -8, -8, 5); c.fillStyle = '#fff'; c.fill(); });
  cell(3, () => { c.scale(28, 28); PATH.diamond(c); c.fillStyle = '#fff'; c.fill(); });
  cell(4, () => { c.scale(30, 30); c.shadowColor = '#fff'; c.shadowBlur = 8; PATH.sparkle(c); c.fillStyle = '#fff'; c.fill(); });
  cell(5, () => { c.fillStyle = '#fff'; rr(c, -8, -24, 16, 48, 5); c.fill(); rr(c, -24, -8, 48, 16, 5); c.fill(); });
  cell(6, () => { c.scale(26, 26); PATH.hexagon(c); c.lineWidth = 0.22; c.strokeStyle = '#fff'; c.stroke(); });
  cell(7, () => { c.scale(28, 28); starPath(c, 5, 1, 0.42); c.fillStyle = '#fff'; c.fill(); });
  return cv;
}
/* =====================================================================
   ENGINE — three.js scene, tweens, card meshes, particles, audio
   Coordinates: everything is positioned in SCREEN PIXELS (x right,
   y down) and converted to world space so 3D objects line up with the
   HTML layout slots.
   ===================================================================== */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 5000);
let VW = 1, VH = 1, CAMD = 1000, DPR = 1;

const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
let isDark = darkMQ.matches;

function resizeRenderer() {
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(VW, VH, false);
  camera.aspect = VW / VH;
  CAMD = (VH / 2) / Math.tan((FOV * Math.PI) / 360);
  camera.position.set(0, 0, CAMD);
  camera.far = CAMD * 3;
  camera.updateProjectionMatrix();
  bg.material.uniforms.uRes.value.set(VW, VH);
  particles.material.uniforms.uDpr.value = DPR;
}

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xfff1dc, 0x4a2a5a, 1.1);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffe2b8, 1.6);
keyLight.position.set(-0.4, 0.7, 1);
scene.add(keyLight);

/* ---------- time & tweens ---------- */
const Ease = {
  linear: (t) => t,
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inBack: (t) => { const c1 = 1.7; return (c1 + 1) * t * t * t - c1 * t * t; },
  outElastic: (t) => (t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
};
let tweens = [];
let slowmo = 1;      // < 1 during the final blow
let paused = false;  // inspect modal pauses battle time
function tween(target, to, dur, ease = Ease.outCubic, delay = 0) {
  // kill conflicting tweens on the same keys
  for (const tw of tweens) if (tw.target === target) for (const k in to) if (k in tw.to) { delete tw.to[k]; }
  return new Promise((res) => {
    tweens.push({ target, to: { ...to }, from: null, dur: Math.max(1e-4, dur), t: -delay, ease, res });
  });
}
function wait(sec) { return tween({ v: 0 }, { v: 1 }, sec); }
function updateTweens(dt) {
  const keep = [];
  for (const tw of tweens) {
    tw.t += dt;
    if (tw.t < 0) { keep.push(tw); continue; }
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.target[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.target[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) tw.res(); else keep.push(tw);
  }

function computeShopLayout() {

  const ro = rectOf('#slot-offers'); const n = run.offers.length; const gap = 10, tagH = 34;
  const w = Math.max(40, Math.min((ro.width - gap * (n - 1)) / n, (ro.height - tagH - 6) / CARD_RATIO, 122));
  const total = w * n + gap * (n - 1);
  run.offers.forEach((c, i) => { if (c) shopSlots.set(c, { x: ro.left + (ro.width - total) / 2 + w / 2 + i * (w + gap), y: ro.top + 2 + (w * CARD_RATIO) / 2, s: w, zone: 'offer' }); });
  sortDeck();
  const rd = rectOf('#slot-deck'); const m = run.deck.cards.length; const g2 = 8;
  let best = { w: 0, cols: 5 };
  for (let cols = 3; cols <= 8; cols++) {
    const rows = Math.ceil(m / cols);
    const cw = Math.min((rd.width - g2 * (cols - 1)) / cols, (rd.height - g2 * (rows - 1)) / rows / CARD_RATIO, 96);
    if (cw > best.w) best = { w: cw, cols };
  }
  const { w: dw, cols } = best; const rows = Math.ceil(m / cols);
  const gridH = rows * dw * CARD_RATIO + (rows - 1) * g2;
  run.deck.cards.forEach((c, i) => {
    const r = Math.floor(i / cols), col = i % cols;
    const inRow = Math.min(cols, m - r * cols);
    const rowW = inRow * dw + (inRow - 1) * g2;
    shopSlots.set(c, { x: rd.left + (rd.width - rowW) / 2 + dw / 2 + col * (dw + g2), y: rd.top + (rd.height - gridH) / 2 + (dw * CARD_RATIO) / 2 + r * (dw * CARD_RATIO + g2), s: dw, zone: 'deck' });
  });
}
function layoutShop(animate = true) {
  computeShopLayout();

  for (const [c] of viewOf) if (!live.has(c)) dropView(c);
  let i = 0;
  for (const [c, slot] of shopSlots) {
    const v = viewFor(c);

    if (v.isNew) {

      v.place({ x: slot.x, y: slot.y + 30, z: 30, s: slot.s * 0.6, ry: Math.PI, rz: 0, sx: 1, sy: 1 });

        squash(e.side, big ? 1.4 : 1);
        medalFX(e.side, KIND_FX[kind] || 'spark', big ? 26 : 14, big ? 1.4 : 1);
        if (kind === 'hit' || kind === 'hex') Sfx.hit(e.chain, big); else if (kind === 'fatigue') Sfx.fatigue(); else if (e.self) Sfx.selfhit(); else Sfx.hit(e.chain, big);
        if (big) { screenShake(e.lethal ? 16 : 9, 0.3); buzz(e.lethal ? [40, 30, 60] : 35); } else buzz(15);
      }
      if (e.blocked > 0) { floater(e.side, `${e.blocked} blocked`, 'blocked', 'shield', e.amount > 0 ? 30 : 0); medalFX(e.side, 'shield', 8); if (!e.amount) Sfx.shield(1); }
      if (lunge) act.to({ y: C.y, sx: 1, sy: 1 }, D(0.14), Ease.outBack);
      await wait(D(e.lethal ? 0.5 : 0.2));
      break;
    }
    case 'shield': {
      syncHud(s); floater(e.side, `+${e.amount}`, 'shield', 'shield'); medalFX(e.side, 'shield', 12); Sfx.shield(s[e.side].chain);
      await wait(D(0.18)); break;
    }
    case 'heal': {
      syncHud(s); floater(e.side, e.amount > 0 ? `+${e.amount}` : 'Full HP', e.amount > 0 ? 'heal' : 'heal small', 'heal'); medalFX(e.side, 'heal', 12); Sfx.heal(s[e.side].chain);
      await wait(D(0.18)); break;
    }
    case 'status': {
      syncHud(s);
      const st = e.status;
      floater(e.side, st === 'freeze' ? (e.amount ? 'Frozen!' : 'Max freeze') : `+${e.amount}`, st, st);
      medalFX(e.side, STATUS_FX[st], 16);
      Sfx[st](s[e.side === 'A' ? 'B' : 'A'].chain);
      await wait(D(0.2)); break;
    }
    case 'combo': {
      const ci = COMBO_INFO[e.combo];
      banner(`${icon(ci.icon)}<div>${ci.name}<small>${ci.sub}</small></div>`, D(1.0), (C.y - 20) + 'px');
      const m = pos[e.side].medal;
      for (const k of ci.fx) burstFX(k, m.x, m.y, 26, 26, 1.5);
      Sfx.combo(e.combo); screenShake(10, 0.3); buzz([20, 20, 40]);
      syncHud(s); await wait(D(0.6)); break;
    }
    case 'curse': {
      const target = pos[e.side].deck;
      if (e.poly) {
        setCaption(`${icon('junk', 'ci')} <span>${e.n} of ${e.side === 'A' ? 'your' : 'their'} cards became Junk!</span>`);
        burstFX('hex', target.x, target.y, 20, 20); Sfx.curse(); await wait(D(0.35));
      } else {
        const name = CARDS[e.id].name;
        setCaption(`${icon(e.id, 'ci')} <span>${e.n} ${name} shuffled into ${e.side === 'A' ? 'your' : esc(B.names.B) + "'s"} deck</span>`);
        Sfx.curse();
        await flyCards(Array.from({ length: e.n }, () => ({ id: e.id, lvl: 1, bonus: 0 })), { x: C.x, y: C.y }, target, e.side);
        burstFX('hex', target.x, target.y, 10, 10);
      }
      syncHud(s); break;
    }
    case 'create': {
      setCaption(`${icon('create', 'ci')} <span>Created: ${e.cards.map((c) => esc(CARDS[c.id].name)).join(', ')}</span>`);
      Sfx.create();
      await flyCards(e.cards, { x: C.x, y: C.y }, pos[e.side].deck, e.side);
      syncHud(s); break;
    }
    case 'morph': {
      const via = CARDS[e.via].name, into = CARDS[e.card.id];
      Sfx.create();
      await act.to({ ry: Math.PI / 2 }, D(0.1), Ease.inCubic);
      act.setCard(e.card, 'full'); burstFX('spark', C.x, C.y, 16, 60);
      await act.to({ ry: 0 }, D(0.16), Ease.outBack);
      setCaption(`<span class="who">${esc(via)} becomes</span>${esc(into.name)}: ${esc(cardLine(e.card))}`);
      await wait(D(0.15)); break;
    }
    case 'buff': {
      const at = pos[e.side].deck;
      if (e.all) setCaption(`${icon('buff', 'ci')} <span>All ${e.side === 'A' ? 'your' : 'their'} cards +${e.amount} this fight!</span>`);
      else setCaption(`${icon('buff', 'ci')} <span>${esc(CARDS[e.target.id].name)} +${e.amount}${e.permanent && e.side === 'A' ? ' permanently!' : ''}</span>`);
      Sfx.buff(); burstFX('gold', at.x, at.y, 18, 16); burstFX('spark', C.x, C.y, 12, 40);
      await wait(D(0.45)); break;
    }
    case 'coin': {
      setCaption(e.heads ? `${icon('gold', 'ci')} <span>Heads! It hits.</span>` : `${icon('gold', 'ci')} <span>Tails… nothing happens.</span>`);
      Sfx.coin(); burstFX('gold', C.x, C.y, 16, 40);
      await act.to({ ry: Math.PI * 2 }, D(0.3)); act.p.ry = 0; break;
    }
    case 'cleanse': { syncHud(s); medalFX(e.side, 'heal', 16); Sfx.heal(1); await wait(D(0.15)); break; }
    case 'note': { setCaption(esc(e.text)); await wait(D(0.3)); break; }
    case 'discard': {
      const to = pos[e.side].disc;
      B.activeAt = 'disc';
      await act.to({ x: to.x, y: to.y, z: 4, s: pos.pw, ry: 0, rz: 0.04, sx: 1, sy: 1 }, D(0.13), Ease.inOutCubic);
      act.show(false);
      B.piles[e.side].disc.setCard(e.card, 'compact');
      syncHud(s); placePiles();
      break;
    }
    default: syncHud(s);
  }
}

async function startBattle() {
  if (sel) deselect(false);
  clearShopViews(); tween(dimState, { o: 0 }, 0.1);
  showScreen('battle');
  battleViewsInit();
  B.speed = B.pref; B.skipping = false; slowmo = 1;
  updateSpeedButtons();
  const opp = run.opp;
  const playerDeck = { name: 'You', hp: PLAYER_HP, glyph: 'hero', cards: run.deck.cards.map((c) => ({ id: c.id, lvl: c.lvl, bonus: c.bonus || 0 })) };
  const seed = (run.seed ^ Math.imul(run.round, 2654435761)) >>> 0;
  const res = simulate(playerDeck, opp, seed);
  B.res = res; B.deckSnapshot = playerDeck;
  B.names = { A: 'You', B: opp.name };
  hud.A.nm.textContent = 'You'; hud.A.arch.textContent = `${playerDeck.cards.length} cards`;
  hud.B.nm.textContent = opp.name; hud.B.arch.textContent = ARCHETYPES[opp.arch].style + ' ›';
  for (const k of ['A', 'B']) { for (const st in hud[k].chips) hud[k].chips[st].remove(); hud[k].chips = {}; }
  medals.A.setFace('hero', '#f07a12'); medals.B.setFace(ARCHETYPES[opp.arch].glyph, ARCHETYPES[opp.arch].color);
  for (const k of ['A', 'B']) { Object.assign(medals[k].p, { sx: 1, sy: 1, rz: 0, ry: 0, flash: 0, ox: 0, z: 6 }); B.piles[k].disc.card = null; }
  B.cur = null; setCaption(''); setActiveSide(null);
  B.active.show(false); B.temps.forEach((v) => v.show(false));
  layoutBattle();
  syncHud(res.events[0].s);
  for (const e of res.events) {
    if (B.skipping) break;
    if (e.t === 'end') break;
    await animEvent(e);
  }
  await endBattle(res);
}
async function endBattle(res) {
  const last = res.events[res.events.length - 1];
  setCaption(''); B.active.show(false); B.temps.forEach((v) => v.show(false));
  syncHud(last.s); placePiles(); setActiveSide(null);
  const won = res.winner === 'A'; const loser = won ? 'B' : 'A';
  // KO: the loser's medallion spins away in slow motion
  slowmo = 0.35;
  Sfx.ko(); screenShake(14, 0.4); buzz([60, 40, 80]);
  medalFX(loser, 'spark', 30, 1.8); medalFX(loser, 'dust', 20, 1.5); medalFX(loser, loser === 'A' ? 'hex' : 'ember', 20, 1.5);
  await tween(medals[loser].p, { rz: Math.PI * 2, sx: 0.2, sy: 0.2, flash: 1 }, 0.5, Ease.inBack);
  slowmo = 1;
  medals[loser].show(false);
  // apply the result to the run
  const before = { wins: run.wins, losses: run.losses };
  if (won) run.wins++; else run.losses++;
  const buffLines = [];
  for (const b of res.buffs) {
    if (b.side !== 'A') continue;
    const card = run.deck.cards[b.index];
    if (card) { card.bonus = (card.bonus || 0) + b.amount; buffLines.push(`${CARDS[card.id].name} +${b.amount}`); }
  }
  const runOver = run.wins >= WINS_TO_WIN || run.losses >= MAX_LOSSES;
  if (!runOver) startRound(); else clearRun();
  if (won) Sfx.win(); else Sfx.lose();
  banner(won ? `${icon('win')} Victory!` : `${icon('lifeoff')} Defeat`, 1.4);
  await wait(1.1);
  const lines = [];
  lines.push(won ? `<p><b>Wins ${run.wins}/${WINS_TO_WIN}</b></p>` : `<p><b>Lives left: ${MAX_LOSSES - run.losses}</b></p>`);
  if (buffLines.length) lines.push(`<p style="color:var(--good);font-weight:800">${icon('buff', 'pip')} Permanent: ${esc(buffLines.join(', '))}</p>`);
  if (!runOver) lines.push(`<p style="color:var(--muted)">+${income(run.round)} gold for round ${run.round}</p>`);
  if (runOver) return showRunEnd(run.wins >= WINS_TO_WIN);
  openModal(`<div class="sheet center-sheet"><div class="big-title">${won ? 'Victory!' : 'Defeat'}</div>${lines.join('')}
    <div class="close-row"><button class="btn primary big" data-act="continue">Continue to Shop</button></div></div>`, {
    center: true, sticky: true, on: (act, close) => { if (act === 'continue') { close(); enterShop(); } } });
}
function showRunEnd(champion) {
  const deckRows = run.deck.cards.map((c) => `${CARDS[c.id].name} ${starStr(c.lvl)}`).join(' · ');
  openModal(`<div class="sheet center-sheet"><div class="big-title">${champion ? 'Champion!' : 'Run Over'}</div>
    <p><b>${run.wins} wins · ${run.losses} losses</b></p>
    <p style="color:var(--muted)">${champion ? 'You conquered all ten foes. Legendary deck!' : 'The tavern awaits your next attempt.'}</p>
    <p style="font-size:16px">${esc(deckRows)}</p>
    <div class="close-row"><button class="btn primary big" data-act="new">New Run</button><button class="btn" data-act="title">Title</button></div></div>`, {
    center: true, sticky: true, on: (act, close) => { close(); if (act === 'new') { newRun(); enterShop(); } else goTitle(); } });
}
function updateSpeedButtons() {
  $('#spd-1').setAttribute('aria-pressed', B.speed === 1 ? 'true' : 'false');
  $('#spd-2').setAttribute('aria-pressed', B.speed === 2 ? 'true' : 'false');
}
$('#spd-1').addEventListener('click', () => { Sfx.click(); if (!B.skipping) B.speed = B.pref = 1; updateSpeedButtons(); });
$('#spd-2').addEventListener('click', () => { Sfx.click(); if (!B.skipping) B.speed = B.pref = 2; updateSpeedButtons(); });
$('#spd-skip').addEventListener('click', () => { Sfx.click(); B.skipping = true; B.speed = 6; });

/* =====================================================================
   INPUT — taps & holds on 3D cards (2D hit tests in screen space)
   ===================================================================== */
let press = null;
function cardAt(x, y) {
  if (screen === 'shop') {
    if (sel) { const v = viewOf.get(sel.card); if (v && v.hit(x, y)) return { card: sel.card, zone: sel.zone }; return null; }
    for (const [c, v] of viewOf) if (v.hit(x, y)) return { card: c, zone: shopSlots.get(c) ? shopSlots.get(c).zone : 'deck' };
  } else if (screen === 'battle') {
    if (B.active && B.active.visible && B.active.hit(x, y)) return { card: B.active.card };
    for (const k of ['A', 'B']) { const dv = B.piles[k].disc; if (dv.visible && dv.card && dv.hit(x, y)) return { card: dv.card }; }
  }
  return null;
}
canvas.addEventListener('pointerdown', (e) => {
  Sfx.ensure();
  const p = { x: e.clientX, y: e.clientY, moved: false, held: false };
  p.timer = setTimeout(() => {
    p.held = true; const hit = cardAt(p.x, p.y);
    if (hit) { buzz(12); Sfx.click(); openInspect(hit.card, { pause: screen === 'battle' }); }
  }, 420);
  press = p;
});
window.addEventListener('pointermove', (e) => { if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14) { press.moved = true; clearTimeout(press.timer); } });
window.addEventListener('pointerup', () => {
  if (!press) return; const p = press; press = null; clearTimeout(p.timer);
  if (p.held || p.moved) return;
  const hit = cardAt(p.x, p.y);
  if (screen === 'shop') {
    if (sel) { if (!hit) { Sfx.click(); deselect(); } return; }
    if (hit) select(hit.card, hit.zone);
  } else if (screen === 'battle' && hit) { Sfx.click(); openInspect(hit.card, { pause: true }); }
});
window.addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; });
document.addEventListener('pointerdown', () => Sfx.ensure(), { capture: true });
window.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------------- buttons ---------------- */
$('#btn-new').addEventListener('click', () => { Sfx.ensure(); Sfx.click(); newRun(); enterShop(); });
$('#btn-continue').addEventListener('click', () => { Sfx.ensure(); Sfx.click(); run = loadRun(); if (run) enterShop(); });
$('#btn-guide-title').addEventListener('click', () => { Sfx.click(); openGuide(); });
$('#btn-help').addEventListener('click', () => { Sfx.click(); openGuide(); });
$('#btn-mute').addEventListener('click', () => { Sfx.toggle(); Sfx.click(); $('#btn-mute').innerHTML = Sfx.muted ? SPEAKER_OFF : SPEAKER_ON; });
$('#btn-reroll').addEventListener('click', reroll);
$('#btn-fight').addEventListener('click', () => { Sfx.click(); buzz(20); startBattle(); });
$('#foe-preview').addEventListener('click', () => { Sfx.click(); openDeckList(run.opp, `${run.opp.name}`, { sub: `${ARCHETYPES[run.opp.arch].style} · ${run.opp.hp} HP · next opponent` }); });
function goTitle() {
  closeModal(); clearShopViews();
  showScreen('title');
  $('#btn-continue').classList.toggle('hidden', !loadRun());
}

/* =====================================================================
   MAIN LOOP, RESIZE, THEME
   ===================================================================== */
function relayout() {
  resizeRenderer();
  if (screen === 'shop') { layoutShop(false); if (sel) { renderSelPanel(); focusSelected(); } }
  else if (screen === 'battle') layoutBattle();
}
window.addEventListener('resize', relayout);
window.visualViewport && window.visualViewport.addEventListener('resize', relayout);
darkMQ.addEventListener && darkMQ.addEventListener('change', (e) => { isDark = e.matches; applyTheme(); });

let lastT = performance.now(), T = 0, ambT = 0;
function frame(now) {
  const realDt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const dt = paused ? 0 : realDt * slowmo;
  T += realDt;
  updateTweens(dt);
  if (screen === 'title') layoutTitle(T);
  // ambient status particles near each medallion (low rate, never over text)
  if (screen === 'battle' && B.cur && !paused) {
    ambT += realDt;
    if (ambT > 0.22) {
      ambT = 0;
      for (const k of ['A', 'B']) {
        const x = B.cur[k], m = B.pos[k].medal;
        if (x.burn > 0) burstFX('ember', m.x, m.y - 10, 1, 22, 0.5);
        if (x.poison > 0) burstFX('bubble', m.x, m.y, 1, 22, 0.5);
        if (x.frozen > 0) burstFX('frost', m.x, m.y, 1, 22, 0.3);
      }
    }
  }
  updateParticles(dt, realDt);
  for (const v of allViews) v.update();
  if (screen === 'battle') { medals.A.update(T); medals.B.update(T); }
  // dim plane
  const dk = (CAMD - 40) / CAMD; dimPlane.scale.set(VW * dk, VH * dk, 1); dimMat.opacity = dimState.o; dimPlane.visible = dimState.o > 0.001;
  // camera shake
  if (shake.t > 0) { shake.t -= realDt; const a = shake.amp * Math.max(0, shake.t / 0.3); camera.position.x = (Math.random() - 0.5) * a; camera.position.y = (Math.random() - 0.5) * a; if (shake.t <= 0) { shake.amp = 0; camera.position.x = 0; camera.position.y = 0; } }
  bg.material.uniforms.uTime.value = T;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
resizeRenderer();
applyTheme();
goTitle();
requestAnimationFrame(frame);
window.__eh = { renderer, get run() { return run; }, set run(r) { run = r; }, B, simulate, startBattle, enterShop, newRun, get screen() { return screen; } };
</script>
